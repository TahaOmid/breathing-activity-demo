  .bg-haze {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(ellipse at 25% 30%, rgba(70, 160, 220, 0.18) 0%, transparent 40%),
      radial-gradient(ellipse at 75% 60%, rgba(50, 120, 180, 0.14) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 90%, rgba(110, 224, 255, 0.12) 0%, transparent 55%);
    filter: blur(30px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    animation: hazeDrift 24s ease-in-out infinite alternate;
  }
  @keyframes hazeDrift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.06); }
  }

  .bg-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .spark {
    position: absolute;
    bottom: -10px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(160, 240, 255, 0.9);
    box-shadow: 0 0 6px rgba(110, 224, 255, 0.9);
    animation: sparkRise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes sparkRise {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translate(var(--drift, 30px), -110vh); opacity: 0; }
  }

  .bg-scan {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 18%;
    left: -20%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(110, 224, 255, 0.05) 30%,
      rgba(160, 240, 255, 0.14) 50%,
      rgba(110, 224, 255, 0.05) 70%,
      transparent 100%);
    filter: blur(8px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    animation: scanSweep 14s ease-in-out infinite;
  }
  @keyframes scanSweep {
    0%   { left: -20%; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { left: 102%; opacity: 0; }
  }

  /* Vignette: now EXPANDS (cyan glow) on inhale, CONTRACTS (darkens) on exhale */
  .bg-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    box-shadow:
      inset 0 0 80px rgba(0, 0, 0, 0.55),
      inset 0 0 140px rgba(0, 10, 25, 0.4);
    will-change: box-shadow;
  }
  .bg-vignette.inhaling { animation: vigExpand   var(--inhale) ease-in-out forwards; }
  .bg-vignette.exhaling { animation: vigContract var(--exhale) ease-in-out forwards; }
  @keyframes vigExpand {
    0%   { box-shadow: inset 0 0 120px rgba(0,0,0,0.75), inset 0 0 220px rgba(0, 0, 0, 0.4); }
    100% { box-shadow: inset 0 0 80px rgba(0,0,0,0.4),  inset 0 0 200px rgba(40, 160, 220, 0.18); }
  }
  @keyframes vigContract {
    0%   { box-shadow: inset 0 0 80px rgba(0,0,0,0.4),  inset 0 0 200px rgba(40, 160, 220, 0.18); }
    100% { box-shadow: inset 0 0 120px rgba(0,0,0,0.75), inset 0 0 220px rgba(0, 0, 0, 0.4); }
  }

  .bg-floor-pool {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28%;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(40, 130, 200, 0.35) 0%,
      rgba(20, 80, 140, 0.15) 35%,
      transparent 70%);
    filter: blur(18px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    animation: poolPulse 8s ease-in-out infinite alternate;
  }
  @keyframes poolPulse {
    0%   { opacity: 0.5; transform: scaleX(0.95); }
    100% { opacity: 0.9; transform: scaleX(1.08); }
  }

  .screen { transition: filter 0.6s ease; }

  /* PRIMARY BREATHING INDICATOR — REVERSED
     INHALE: rings EXPAND outward and brighten
     EXHALE: rings CONTRACT inward and dim */
  .breath-ring {
    position: absolute;
    top: 38.4%;
    left: 48.5%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    aspect-ratio: 1;
    will-change: width, opacity, border-width, box-shadow;
  }

  .breath-ring.outer {
    width: 22%;
    border: 1.5px solid rgba(110, 224, 255, 0.35);
    box-shadow:
      0 0 30px rgba(110, 224, 255, 0.25),
      inset 0 0 20px rgba(110, 224, 255, 0.1);
    z-index: 3;
  }
  .breath-ring.middle {
    width: 16%;
    border: 2px solid rgba(110, 224, 255, 0.55);
    box-shadow:
      0 0 24px rgba(110, 224, 255, 0.4),
      inset 0 0 16px rgba(110, 224, 255, 0.2);
    z-index: 4;
  }
  .breath-ring.inner {
    width: 10%;
    border: 2.5px solid rgba(160, 238, 255, 0.85);
    box-shadow:
      0 0 32px rgba(160, 238, 255, 0.7),
      inset 0 0 14px rgba(160, 238, 255, 0.5);
    z-index: 5;
    background: radial-gradient(circle,
      rgba(110, 224, 255, 0.3) 0%,
      rgba(110, 224, 255, 0.1) 50%,
      transparent 90%);
  }

  .breath-ring.outer.inhaling  { animation: outerInhale  var(--inhale) ease-in-out forwards; }
  .breath-ring.middle.inhaling { animation: middleInhale var(--inhale) ease-in-out forwards; }
  .breath-ring.inner.inhaling  { animation: innerInhale  var(--inhale) ease-in-out forwards; }
  .breath-ring.outer.exhaling  { animation: outerExhale  var(--exhale) ease-in-out forwards; }
  .breath-ring.middle.exhaling { animation: middleExhale var(--exhale) ease-in-out forwards; }
  .breath-ring.inner.exhaling  { animation: innerExhale  var(--exhale) ease-in-out forwards; }

  @keyframes outerInhale {
    0%   { width: 18%; opacity: 0.15; border-width: 1px; }
    100% { width: 92%; opacity: 0.7;  border-width: 2.5px; }
  }
  @keyframes outerExhale {
    0%   { width: 92%; opacity: 0.7;  border-width: 2.5px; }
    100% { width: 18%; opacity: 0.15; border-width: 1px; }
  }
  @keyframes middleInhale {
    0%   { width: 14%; opacity: 0.3; border-width: 1.5px; }
    100% { width: 64%; opacity: 1;   border-width: 3.5px; }
  }
  @keyframes middleExhale {
    0%   { width: 64%; opacity: 1;   border-width: 3.5px; }
    100% { width: 14%; opacity: 0.3; border-width: 1.5px; }
  }
  @keyframes innerInhale {
    0%   { width: 9%;  opacity: 0.5; border-width: 2px; }
    100% { width: 38%; opacity: 1;   border-width: 4px; }
  }
  @keyframes innerExhale {
    0%   { width: 38%; opacity: 1;   border-width: 4px; }
    100% { width: 9%;  opacity: 0.5; border-width: 2px; }
  }

  /* Chest spotlight - now BRIGHT on inhale, DIM on exhale */
  .chest-spotlight {
    position: absolute;
    top: 38.4%;
    left: 48.5%;
    width: 30%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(160, 240, 255, 0.95) 0%,
      rgba(100, 210, 250, 0.6) 18%,
      rgba(50, 170, 230, 0.3) 38%,
      transparent 65%);
    filter: blur(4px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
    z-index: 2;
  }
  .chest-spotlight.inhaling { animation: spotOn  var(--inhale) ease-in-out forwards; }
  .chest-spotlight.exhaling { animation: spotOff var(--exhale) ease-in-out forwards; }
  @keyframes spotOn  { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes spotOff { 0% { opacity: 1; } 100% { opacity: 0; } }

  .eye-glow {
    position: absolute;
    width: 7%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(180, 245, 255, 1) 0%,
      rgba(110, 220, 250, 0.7) 25%,
      rgba(50, 170, 230, 0.3) 55%,
      transparent 80%);
    filter: blur(2px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
    z-index: 3;
  }
  .eye-glow.left  { top: 20.4%; left: 42.5%; }
  .eye-glow.right { top: 20.4%; left: 55.3%; }
  .eye-glow.inhaling { animation: spotOn  var(--inhale) ease-in-out forwards; }
  .eye-glow.exhaling { animation: spotOff var(--exhale) ease-in-out forwards; }

  .floor-glow {
    position: absolute;
    bottom: 13%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 7%;
    background: radial-gradient(ellipse,
      rgba(110, 224, 255, 0.55) 0%,
      rgba(70, 180, 230, 0.2) 45%,
      transparent 80%);
    filter: blur(6px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
    z-index: 3;
  }
  .floor-glow.inhaling { animation: spotOn  var(--inhale) ease-in-out forwards; }
  .floor-glow.exhaling { animation: spotOff var(--exhale) ease-in-out forwards; }

  /* Chest dim - now appears on EXHALE (when rings are small) */
  .chest-dim {
    position: absolute;
    top: 38.4%;
    left: 48.5%;
    width: 12%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(0, 10, 20, 0.7) 0%,
      rgba(0, 10, 20, 0.35) 40%,
      transparent 75%);
    filter: blur(3px);
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: 0;
    will-change: opacity;
    z-index: 2;
  }
  .chest-dim.inhaling { animation: dimOff var(--inhale) ease-in-out forwards; }
  .chest-dim.exhaling { animation: dimOn  var(--exhale) ease-in-out forwards; }
  @keyframes dimOn  { 0% { opacity: 0; }    100% { opacity: 0.85; } }
  @keyframes dimOff { 0% { opacity: 0.85; } 100% { opacity: 0; } }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 18px 22px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
  }
  .bpm-top {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--bone);
    text-shadow: 0 2px 10px rgba(0,0,0,0.95);
  }
  .bpm-num { display: inline-block; min-width: 2ch; text-align: right; }
  .bpm-unit { font-size: 14px; opacity: 0.85; margin-left: 4px; letter-spacing: 0.1em; }
  .settings-btn {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(110, 224, 255, 0.35);
    color: var(--bone);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }
  .settings-btn:hover { border-color: var(--cyan); transform: rotate(30deg); }

  .phase-label {
    position: absolute;
    top: 64%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 8;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.45s ease;
  }
  .phase-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.4em;
    padding-left: 0.4em;
    color: var(--cyan-bright);
    text-shadow:
      0 0 24px rgba(110, 224, 255, 0.8),
      0 0 40px rgba(110, 224, 255, 0.5),
      0 2px 10px rgba(0,0,0,0.95);
    text-transform: uppercase;
  }
  .phase-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: rgba(232, 238, 242, 0.7);
    text-transform: uppercase;
    margin-top: 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }

  .bottom-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    gap: 6px;
  }
  .readouts { display: flex; gap: 10px; margin-bottom: 4px; }
  .readout {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(110, 224, 255, 0.2);
    padding: 4px 10px;
    border-radius: 4px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .readout-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.18em;
    color: var(--cyan-dim);
    text-transform: uppercase;
  }
  .readout-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bone);
    font-weight: 500;
    margin-top: 1px;
  }
  .bpm-large {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.06em;
    color: var(--bone);
    text-shadow: 0 2px 14px rgba(0,0,0,1);
    margin-bottom: 4px;
  }
  .instruction-pill {
    background: rgba(20, 25, 30, 0.88);
    border: 1px solid rgba(110, 224, 255, 0.22);
    backdrop-filter: blur(10px);
    padding: 14px 36px;
    border-radius: 26px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    min-width: 200px;
    transition: border-color 0.6s ease, box-shadow 0.6s ease;
  }
  .instruction-pill.bright {
    border-color: rgba(110, 224, 255, 0.7);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 22px rgba(110, 224, 255, 0.45);
  }
  .instruction {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.05em;
    color: var(--bone);
    transition: opacity 0.45s ease;
  }
  .cycle-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--ink-dim);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .welcome {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0, 15, 25, 0.95) 0%, rgba(0, 0, 0, 0.99) 100%);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  .welcome.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .welcome-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.4em;
    color: var(--bone);
    margin-bottom: 8px;
    padding-left: 0.4em;
    text-shadow: 0 0 24px rgba(110, 224, 255, 0.4);
  }
  .welcome-divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--cyan), transparent);
    margin: 14px 0 22px;
  }
  .welcome-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(232, 238, 242, 0.78);
    max-width: 300px;
    margin-bottom: 30px;
  }
  .welcome-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    margin-bottom: 28px;
    letter-spacing: 0.05em;
    max-width: 280px;
    line-height: 1.5;
    opacity: 0.85;
  }
  .begin-btn {
    background: rgba(110, 224, 255, 0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 14px 36px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .begin-btn:hover { background: rgba(110, 224, 255, 0.22); box-shadow: 0 0 28px rgba(110, 224, 255, 0.5); }

  .settings-panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(280px, 85%);
    background: rgba(8, 14, 20, 0.97);
    backdrop-filter: blur(20px);
    border-left: 1px solid rgba(110, 224, 255, 0.25);
    padding: 28px 22px;
    z-index: 50;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
  }
  .settings-panel.open { transform: translateX(0); }
  .settings-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(110, 224, 255, 0.25);
    font-weight: 600;
  }
  .setting-row { margin-bottom: 18px; }
  .setting-row label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(232, 238, 242, 0.7);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .setting-row input[type="range"] { width: 100%; accent-color: var(--cyan); }
  .setting-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    color: var(--bone);
    float: right;
  }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .checkbox-row input { accent-color: var(--cyan); }
  .checkbox-row label { margin: 0; cursor: pointer; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .close-settings {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: 1px solid rgba(110, 224, 255, 0.3);
    color: var(--bone);
    font-size: 18px;
    cursor: pointer;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    line-height: 1;
  }

  @media (max-width: 420px) {
    .bpm-top { font-size: 18px; }

</style>
</head>
<body>

<div class="screen">

  <div class="bg-haze"></div>
  <div class="bg-floor-pool"></div>
  <div class="bg-particles" id="bg-particles"></div>
  <div class="bg-scan"></div>
  <div class="bg-vignette" id="bg-vignette"></div>

  <div class="chest-dim" id="chest-dim"></div>
  <div class="chest-spotlight" id="chest-spotlight"></div>
  <div class="breath-ring outer"  id="ring-outer"></div>
  <div class="breath-ring middle" id="ring-middle"></div>
  <div class="breath-ring inner"  id="ring-inner"></div>
  <div class="eye-glow left"  id="eye-l"></div>
  <div class="eye-glow right" id="eye-r"></div>
  <div class="floor-glow" id="floor"></div>

  <div class="phase-label" id="phase-label">
    <div class="phase-text" id="phase-text">INHALE</div>
    <div class="phase-hint" id="phase-hint">rings expand · breathe in</div>
  </div>

  <div class="top-bar">
    <div class="bpm-top">
      <span class="bpm-num" id="bpm-top">82</span><span class="bpm-unit">BPM</span>
    </div>
    <button class="settings-btn" id="settings-toggle" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="bottom-area">
    <div class="readouts" id="readouts">
      <div class="readout"><div class="readout-label">HRV</div><div class="readout-value" id="hrv-val">58</div></div>
      <div class="readout"><div class="readout-label">Resp</div><div class="readout-value" id="resp-val">6.5</div></div>
    </div>
    <div class="bpm-large" id="bpm-large">82 BPM</div>
    <div class="instruction-pill" id="instruction-pill">
      <div class="instruction" id="instruction">Inhale...</div>
    </div>
    <div class="cycle-counter" id="cycle-counter">CYCLE 1 OF 5</div>
  </div>

  <div class="welcome" id="welcome">
    <div class="welcome-title">SENTINEL</div>
    <div class="welcome-divider"></div>
    <div class="welcome-text" id="welcome-text">A paced breathing exercise. Match your breath to the rings on the sentinel's chest.</div>
    <div class="welcome-hint">→ Rings <strong>EXPAND</strong> = breathe IN<br>→ Rings <strong>CONTRACT</strong> = breathe OUT</div>
    <button class="begin-btn" id="begin-btn">Begin</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <button class="close-settings" id="close-settings">×</button>
    <div class="settings-title">Session</div>
    <div class="setting-row">
      <label>Inhale <span class="setting-value" id="inhale-val">4.6s</span></label>
      <input type="range" id="inhale-slider" min="2000" max="8000" step="100" value="4600">
    </div>
    <div class="setting-row">
      <label>Exhale <span class="setting-value" id="exhale-val">4.6s</span></label>
      <input type="range" id="exhale-slider" min="2000" max="8000" step="100" value="4600">
    </div>

      <input type="range" id="count-slider" min="1" max="30" step="1" value="5">

    <div class="checkbox-row"><input type="checkbox" id="show-hrv" checked><label for="show-hrv">Show HRV</label></div>
    <div class="checkbox-row"><input type="checkbox" id="show-resp" checked><label for="show-resp">Show Respiration</label></div>
    <div class="checkbox-row"><input type="checkbox" id="show-bpm" checked><label for="show-bpm">Show BPM</label></div>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  let config = {
    inhale: parseInt(params.get('inhale')) || 4600,
    exhale: parseInt(params.get('exhale')) || 4600,
    count: parseInt(params.get('count')) || 5,
    showHrv: params.get('showHrv') !== '0',
    showResp: params.get('showRespiration') !== '0',
    showBpm: params.get('showBpm') !== '0',
    welcome: params.get('welcome') || "A paced breathing exercise. Match your breath to the rings on the sentinel's chest."
  };
  document.getElementById('welcome-text').textContent = config.welcome;

  function applyTimings() {
    document.documentElement.style.setProperty('--inhale', config.inhale + 'ms');
    document.documentElement.style.setProperty('--exhale', config.exhale + 'ms');
  }
  applyTimings();

  function applyDisplayToggles() {
    const readouts = document.getElementById('readouts');
    readouts.children[0].style.display = config.showHrv ? 'block' : 'none';
    readouts.children[1].style.display = config.showResp ? 'block' : 'none';
    readouts.style.display = (config.showHrv || config.showResp) ? 'flex' : 'none';
    document.querySelector('.bpm-top').style.display = config.showBpm ? 'block' : 'none';
    document.getElementById('bpm-large').style.display = config.showBpm ? 'block' : 'none';
  }
  applyDisplayToggles();

  const animatedEls = [
    document.getElementById('ring-outer'),
    document.getElementById('ring-middle'),
    document.getElementById('ring-inner'),
    document.getElementById('chest-spotlight'),
    document.getElementById('chest-dim'),
    document.getElementById('eye-l'),
    document.getElementById('eye-r'),
    document.getElementById('floor'),
    document.getElementById('bg-vignette'),
  ];

  const bgParticles = document.getElementById('bg-particles');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (10 + Math.random() * 12) + 's';
    s.style.animationDelay = (Math.random() * 12) + 's';
    s.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    const size = 1 + Math.random() * 2.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.opacity = (0.4 + Math.random() * 0.5).toFixed(2);
    bgParticles.appendChild(s);
  }

  const instruction = document.getElementById('instruction');
  const instructionPill = document.getElementById('instruction-pill');
  const phaseText = document.getElementById('phase-text');
  const phaseHint = document.getElementById('phase-hint');
  const phaseLabel = document.getElementById('phase-label');
  const cycleCounter = document.getElementById('cycle-counter');
  const bpmTop = document.getElementById('bpm-top');
  const bpmLarge = document.getElementById('bpm-large');
  const hrvVal = document.getElementById('hrv-val');
  const respVal = document.getElementById('resp-val');

  let running = false;
  let currentCycle = 0;
  let phaseTimeout = null;
  let metricsInterval = null;

  function setPhase(phase) {
    animatedEls.forEach(el => el.classList.remove('inhaling', 'exhaling'));
    void animatedEls[0].offsetWidth;
    if (phase) animatedEls.forEach(el => el.classList.add(phase));
  }

  function setInhale() {
    setPhase('inhaling');
    phaseLabel.style.opacity = '0';
    instruction.style.opacity = '0';
    instructionPill.classList.add('bright');
    setTimeout(() => {
      phaseText.textContent = 'INHALE';
      phaseHint.textContent = 'rings expand \u00b7 breathe in';
      instruction.textContent = 'Inhale...';
      phaseLabel.style.opacity = '1';
      instruction.style.opacity = '1';
    }, 200);
  }

  function setExhale() {
    setPhase('exhaling');
    phaseLabel.style.opacity = '0';
    instruction.style.opacity = '0';
    instructionPill.classList.remove('bright');
    setTimeout(() => {
      phaseText.textContent = 'EXHALE';
      phaseHint.textContent = 'rings contract \u00b7 breathe out';
      instruction.textContent = 'Exhale...';
      phaseLabel.style.opacity = '1';
      instruction.style.opacity = '1';
    }, 200);
  }

  function setComplete() {
    setPhase(null);
    animatedEls.forEach(el => el.style.opacity = '');
    document.getElementById('ring-outer').style.cssText  = 'width: 92%; opacity: 0.7; border-width: 2.5px;';
    document.getElementById('ring-middle').style.cssText = 'width: 64%; opacity: 1; border-width: 3.5px;';
    document.getElementById('ring-inner').style.cssText  = 'width: 38%; opacity: 1; border-width: 4px;';
    document.getElementById('chest-spotlight').style.opacity = '1';
    document.getElementById('eye-l').style.opacity = '1';
    document.getElementById('eye-r').style.opacity = '1';
    document.getElementById('floor').style.opacity = '0.7';
    phaseLabel.style.opacity = '0';
    instruction.style.opacity = '0';
    instructionPill.classList.remove('bright');
    setTimeout(() => {
      phaseText.textContent = 'COMPLETE';
      phaseHint.textContent = 'session ended';
      instruction.textContent = 'Session complete';
      phaseLabel.style.opacity = '1';
      instruction.style.opacity = '1';
    }, 200);
  }

  function updateMetrics() {
    const baseBpm = 82;
    const drift = Math.max(0, currentCycle - 1) * 0.6;
    const noise = Math.sin(Date.now() / 700) * 1.2;
    const bpm = Math.round(baseBpm - drift + noise);
    bpmTop.textContent = bpm;
    bpmLarge.textContent = bpm + ' BPM';
    const baseHrv = 58;
    hrvVal.textContent = Math.round(baseHrv + currentCycle * 0.8 + Math.sin(Date.now() / 900) * 2);
    const cycleSec = (config.inhale + config.exhale) / 1000;
    respVal.textContent = (60 / cycleSec).toFixed(1);
  }

  function runCycle() {
    if (!running) return;
    if (currentCycle >= config.count) {
      setComplete();
      cycleCounter.textContent = 'COMPLETE \u00b7 ' + config.count + ' CYCLES';
      running = false;
      clearInterval(metricsInterval);
      updateMetrics();
      return;
    }
    currentCycle++;
    cycleCounter.textContent = 'CYCLE ' + currentCycle + ' OF ' + config.count;
    updateMetrics();
    setInhale();
    phaseTimeout = setTimeout(() => {
      if (!running) return;
      setExhale();
      phaseTimeout = setTimeout(runCycle, config.exhale);
    }, config.inhale);
  }

  function startSession() {
    running = true;
    currentCycle = 0;
    animatedEls.forEach(el => el.style.cssText = '');
    updateMetrics();
    metricsInterval = setInterval(updateMetrics, 600);
    runCycle();
  }

  document.getElementById('begin-btn').addEventListener('click', () => {
    document.getElementById('welcome').classList.add('hidden');
    setTimeout(startSession, 400);
  });

  const settingsPanel = document.getElementById('settings-panel');
  document.getElementById('settings-toggle').addEventListener('click', () => settingsPanel.classList.add('open'));
  document.getElementById('close-settings').addEventListener('click', () => settingsPanel.classList.remove('open'));

  const inhaleSlider = document.getElementById('inhale-slider');
  const exhaleSlider = document.getElementById('exhale-slider');
  const countSlider = document.getElementById('count-slider');
  inhaleSlider.value = config.inhale;
  exhaleSlider.value = config.exhale;
  countSlider.value = config.count;
  document.getElementById('inhale-val').textContent = (config.inhale / 1000).toFixed(1) + 's';
  document.getElementById('exhale-val').textContent = (config.exhale / 1000).toFixed(1) + 's';
  document.getElementById('count-val').textContent = config.count;
  document.getElementById('show-hrv').checked = config.showHrv;
  document.getElementById('show-resp').checked = config.showResp;
  document.getElementById('show-bpm').checked = config.showBpm;
  inhaleSlider.addEventListener('input', e => { config.inhale = parseInt(e.target.value); document.getElementById('inhale-val').textContent = (config.inhale/1000).toFixed(1)+'s'; applyTimings(); });
  exhaleSlider.addEventListener('input', e => { config.exhale = parseInt(e.target.value); document.getElementById('exhale-val').textContent = (config.exhale/1000).toFixed(1)+'s'; applyTimings(); });
  countSlider.addEventListener('input', e => { config.count = parseInt(e.target.value); document.getElementById('count-val').textContent = config.count; });
  document.getElementById('show-hrv').addEventListener('change', e => { config.showHrv = e.target.checked; applyDisplayToggles(); });
  document.getElementById('show-resp').addEventListener('change', e => { config.showResp = e.target.checked; applyDisplayToggles(); });
  document.getElementById('show-bpm').addEventListener('change', e => { config.showBpm = e.target.checked; applyDisplayToggles(); });

  document.addEventListener('click', (e) => {
    if (e.target.closest('.welcome') || e.target.closest('.settings-panel') || e.target.closest('.settings-btn')) return;
    if (!running && currentCycle >= config.count) startSession();
  });
</script>

</body>
</html>
