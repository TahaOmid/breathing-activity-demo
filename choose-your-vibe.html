<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0a1d" />
<title>Choose Your Vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #0b0a1d;
    --bg-2: #1a1438;
    --bg-3: #2a1d3f;
    --text: #f0ebe2;
    --text-soft: #a89cc4;
    --accent: #ffd4a3;
    --halo: rgba(180, 150, 230, 0.40);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg-1);
    color: var(--text);
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(120, 80, 200, 0.40), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 100%, rgba(255, 180, 130, 0.18), transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment: fixed;
    position: relative;
  }

  /* Scattered starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 8%,  rgba(255,255,255,0.75), transparent 50%),
      radial-gradient(1px 1px at 28% 22%, rgba(255,255,255,0.45), transparent 50%),
      radial-gradient(1px 1px at 47% 14%, rgba(255,255,255,0.65), transparent 50%),
      radial-gradient(1.5px 1.5px at 68% 6%, rgba(255,255,255,0.55), transparent 50%),
      radial-gradient(1px 1px at 83% 18%, rgba(255,255,255,0.70), transparent 50%),
      radial-gradient(1px 1px at 8% 42%,  rgba(255,255,255,0.40), transparent 50%),
      radial-gradient(1px 1px at 92% 35%, rgba(255,255,255,0.55), transparent 50%),
      radial-gradient(1px 1px at 38% 88%, rgba(255,255,255,0.60), transparent 50%),
      radial-gradient(1px 1px at 72% 78%, rgba(255,255,255,0.40), transparent 50%),
      radial-gradient(1.5px 1.5px at 18% 95%, rgba(255,255,255,0.55), transparent 50%),
      radial-gradient(1px 1px at 58% 62%, rgba(255,255,255,0.35), transparent 50%);
    pointer-events: none;
    opacity: 0.85;
    z-index: 0;
  }

  main {
    max-width: 520px;
    margin: 0 auto;
    padding: max(env(safe-area-inset-top), 56px) 24px max(env(safe-area-inset-bottom), 56px);
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 52px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.9s 0.05s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }

  .kicker {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.74rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.9;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(2.1rem, 9vw, 3rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--text);
    font-variation-settings: "opsz" 144;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
    font-variation-settings: "opsz" 144;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 36px 18px;
    justify-items: center;
    padding: 4px 0;
  }

  /* If there's an odd number of items, the last one centers across the row */
  .vibe-card:nth-child(odd):last-child {
    grid-column: 1 / -1;
  }

  .vibe-card {
    --float-duration: 5s;
    --float-delay: 0s;
    --tilt: 1deg;
    --enter-delay: 0.3s;

    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    width: 100%;
    max-width: 168px;
    opacity: 0;
    animation: fadeIn 0.8s var(--enter-delay) cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
  }

  .vibe-card:active {
    transform: scale(0.94);
    transition-duration: 0.1s;
  }

  /* The wrapper handles the float; label stays anchored for a nice contrast */
  .icon-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float var(--float-duration) ease-in-out infinite var(--float-delay);
    will-change: transform;
  }

  .icon-halo {
    position: absolute;
    inset: -14%;
    background: radial-gradient(circle at 50% 55%, var(--halo) 0%, transparent 62%);
    filter: blur(10px);
    opacity: 0.65;
    z-index: 0;
    animation: pulse 6.5s ease-in-out infinite var(--float-delay);
    pointer-events: none;
  }

  .icon {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
    border-radius: 22%; /* keeps shape tidy if a non-pre-rounded icon is added later */
  }

  .label {
    margin-top: 16px;
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--text);
    text-align: center;
    opacity: 0.95;
  }

  footer {
    text-align: center;
    margin-top: 56px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 0.85rem;
    color: var(--text-soft);
    opacity: 0;
    animation: fadeIn 1.2s 1.2s ease-out forwards;
  }

  /* Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-7px) rotate(var(--tilt)); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.45; transform: scale(0.94); }
    50%      { opacity: 0.85; transform: scale(1.06); }
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Respect users who prefer no motion */
  @media (prefers-reduced-motion: reduce) {
    .icon-wrap, .icon-halo { animation: none !important; }
    .vibe-card, header, footer { animation-duration: 0.3s !important; }
  }

  /* A touch more breathing room on small phones */
  @media (max-width: 360px) {
    .grid { gap: 28px 14px; }
    .vibe-card { max-width: 140px; }
    main { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">Take a breath</p>
      <h1>Choose Your <em>Vibe</em></h1>
    </header>

    <div class="grid" id="grid" role="list"></div>

    <footer>Inhale. Exhale. Begin.</footer>
  </main>

  <script>
    /* -------------------------------------------------------------
       Add new breathing exercises here.
       Each entry just needs: name, icon filename, and url.
       The grid layout, animation, and entrance stagger are handled
       automatically for any number of items.
    ------------------------------------------------------------- */
    const vibes = [
      {
        name: "Space Droplet",
        icon: "spaceDropLet_appIcon.png",
        url:  "https://sales.avicennaresearch.com/media/public/breathing-activity-demo/index-droplet.html"
      },
      {
        name: "Sentinel",
        icon: "Sentinel_appIcon.png",
        url:  "https://sales.avicennaresearch.com/media/public/breathing-activity-demo/sentinel-breath-2.html"
      },
      {
        name: "UFO",
        icon: "UFO_appIcon.png",
        url:  "https://sales.avicennaresearch.com/media/public/breathing-activity-demo/ufo-breath.html"
      },
      {
        name: "The Blob",
        icon: "theBlob_appIcon.png",
        url:  "https://sales.avicennaresearch.com/media/public/breathing-activity-demo/CuteBlob.html"
      },
      {
        name: "Inner Power",
        icon: "innePower_appIcon.png",
        url:  "https://sales.avicennaresearch.com/media/public/breathing-activity-demo/inner-power.html"
      }
    ];

    const grid = document.getElementById('grid');

    vibes.forEach((v, i) => {
      // Slightly varied float timing so icons feel independent, not synced
      const duration   = (4.6 + ((i * 0.53) % 2.4)).toFixed(2) + 's';
      const delay      = ((i * 0.71) % 3.2).toFixed(2) + 's';
      const tilt       = (((i % 2 === 0) ? 1 : -1) * (0.6 + (i % 3) * 0.35)).toFixed(2) + 'deg';
      const enterDelay = (0.25 + i * 0.09).toFixed(2) + 's';

      const card = document.createElement('a');
      card.className = 'vibe-card';
      card.setAttribute('role', 'listitem');
      card.href = v.url;
      card.setAttribute('aria-label', `Start ${v.name} breathing exercise`);
      card.style.setProperty('--float-duration', duration);
      card.style.setProperty('--float-delay', delay);
      card.style.setProperty('--tilt', tilt);
      card.style.setProperty('--enter-delay', enterDelay);

      card.innerHTML = `
        <div class="icon-wrap">
          <div class="icon-halo"></div>
          <img class="icon" src="${v.icon}" alt="" loading="lazy" decoding="async" />
        </div>
        <span class="label">${v.name}</span>
      `;

      grid.appendChild(card);
    });
  </script>
</body>
</html>
