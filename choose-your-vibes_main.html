<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1f" />
  <title>Choose your Vibes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-deep:  #0a0a1f;
      --bg-mid:   #1a1438;
      --bg-soft:  #2d1f5a;
      --accent:   #f5d0a9;
      --text:     #f4eef9;
      --text-dim: #b8a8d4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: calc(48px + var(--safe-top)) 22px calc(40px + var(--safe-bot));
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-soft) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #3a1e5c 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 100%, #1b1745 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 18% 22%, rgba(255,255,255,.65) 50%, transparent 51%),
        radial-gradient(1px 1px at 82% 18%, rgba(255,255,255,.45) 50%, transparent 51%),
        radial-gradient(1px 1px at 62% 70%, rgba(255,255,255,.5)  50%, transparent 51%),
        radial-gradient(1px 1px at 28% 82%, rgba(255,255,255,.35) 50%, transparent 51%),
        radial-gradient(1px 1px at 90% 52%, rgba(255,255,255,.5)  50%, transparent 51%),
        radial-gradient(1px 1px at 8%  60%, rgba(255,255,255,.4)  50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 48% 14%, rgba(245,208,169,.55) 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 88%, rgba(255,255,255,.4)  50%, transparent 51%);
      background-size: 720px 720px;
      opacity: .7;
      pointer-events: none;
      animation: twinkle 9s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .55; }
      50%      { opacity: .9;  }
    }

    .header {
      text-align: center;
      margin-bottom: 38px;
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: .85;
      margin-bottom: 10px;
    }
    .title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: clamp(34px, 9.5vw, 48px);
      line-height: 1.04;
      letter-spacing: -.02em;
      background: linear-gradient(180deg, #fff 0%, #d4c5e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .title em {
      font-style: italic;
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
    }
    .subtitle {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 300;
      color: var(--text-dim);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 26px 18px;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .vibe {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      animation:
        float  var(--float-dur, 5s) ease-in-out var(--float-delay, 0s) infinite,
        fadeIn .7s ease-out var(--enter-delay, 0s) forwards;
      will-change: transform, opacity;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-7px) rotate(var(--tilt, .6deg)); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .icon-wrap {
      width: 100%;
      max-width: 150px;
      aspect-ratio: 1 / 1;
      position: relative;
      filter: drop-shadow(0 14px 26px rgba(0,0,0,.5));
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
    }
    .vibe:active .icon-wrap { transform: scale(.92); }

    .icon-wrap::after {
      content: "";
      position: absolute;
      inset: -14%;
      background: radial-gradient(circle, var(--glow, rgba(245,208,169,.18)) 0%, transparent 62%);
      z-index: -1;
      pointer-events: none;
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    .label {
      margin-top: 14px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: .01em;
      color: var(--text);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .vibe, body::before { animation: none !important; }
      .vibe { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="eyebrow">Breathe &middot; Reset &middot; Restore</div>
    <h1 class="title">Choose your <em>vibe</em></h1>
    <p class="subtitle">Pick a companion. Take a breath.</p>
  </header>

  <main class="grid" id="grid"></main>

                loading <ICON_PATH><filename>.png from disk.

    /* ---------- Icon resolution (case-insensitive) ---------- */

    function ensureExt(name) {
      return /\.(png|jpe?g|webp|svg|gif)$/i.test(name) ? name : name + ".png";
    }

    function caseVariants(filename) {
      const dot  = filename.lastIndexOf(".");
      const base = filename.slice(0, dot);
      const ext  = filename.slice(dot).toLowerCase();
      const cap   = s => s ? s[0].toUpperCase() + s.slice(1) : s;
      const decap = s => s ? s[0].toLowerCase() + s.slice(1) : s;
      return [...new Set([
        filename,
        base + ext,
        base.toLowerCase() + ext,
        base.toUpperCase() + ext,
        cap(base) + ext,
        decap(base) + ext
      ])];
    }

    function resolveIcon(key) {
      // 1) Try embedded data URI (case-insensitive lookup)
      const cleanKey = key.replace(/\.(png|jpe?g|webp|svg|gif)$/i, "").toLowerCase();
      if (EMBEDDED_ICONS[cleanKey]) {
        return { sources: [EMBEDDED_ICONS[cleanKey]] };
      }
      // 2) Fall back to file path with case variants
      return { sources: caseVariants(ensureExt(key)).map(v => ICON_PATH + v) };
    }

    /* ---------- Render ---------- */

    function buildVibe(app, i) {
      const a = document.createElement("a");
      a.className = "vibe";
      a.href = app.url;
      a.setAttribute("aria-label", app.name + " breathing exercise");

      const floatDur   = (4.6 + (i % 3) * 0.55).toFixed(2) + "s";
      const floatDelay = (i * 0.32).toFixed(2) + "s";
      const tilt       = (i % 2 === 0 ? 0.7 : -0.7) + "deg";
      const enterDelay = (0.08 + i * 0.09).toFixed(2) + "s";
      a.style.setProperty("--float-dur",   floatDur);
      a.style.setProperty("--float-delay", floatDelay);
      a.style.setProperty("--tilt",        tilt);
      a.style.setProperty("--enter-delay", enterDelay);

      const wrap = document.createElement("div");
      wrap.className = "icon-wrap";
      if (app.glow) wrap.style.setProperty("--glow", app.glow);

      const img = document.createElement("img");
      img.alt = app.name;
      img.loading = "lazy";
      img.decoding = "async";

      const { sources } = resolveIcon(app.icon);
      let attempt = 0;
      img.src = sources[attempt];
      img.onerror = () => {
        attempt += 1;
        if (attempt < sources.length) {
          img.src = sources[attempt];
        } else {
          img.style.visibility = "hidden";
          console.warn("Icon not found for", app.name, "— tried:", sources);
        }
      };

      wrap.appendChild(img);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = app.name;

      a.appendChild(wrap);
      a.appendChild(label);
      return a;
    }

    const grid = document.getElementById("grid");
    APPS.forEach((app, i) => grid.appendChild(buildVibe(app, i)));
  </script>
</body>
</html>
