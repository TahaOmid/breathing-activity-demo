<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1840" />
<title>Cosmic Breath</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
:root {
  --navy: #050b25;
  --deep-blue: #0c1b3d;
  --blue: #2b6dd9;
  --cyan: #6cd0ff;
  --cyan-bright: #b8e8ff;
  --white: #ffffff;
  --purple: #a78bfa;
  --text-white: #ffffff;
  --text-soft: #d6e7ff;
  --text-muted: rgba(214,231,255,0.7);
  --inhale-glow: rgba(108,208,255,0.6);
  --exhale-glow: rgba(167,139,250,0.55);
  --card-bg: rgba(10,20,55,0.55);
  --card-border: rgba(108,208,255,0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text-white);
  background: var(--navy);
  overflow: hidden;
}

#app {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  isolation: isolate;
}

/* ============ BACKGROUND ============ */
.bg-image {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
  z-index: -5;
  animation: bgDrift 50s ease-in-out infinite alternate;
}
@keyframes bgDrift {
  0%   { transform: scale(1.05) translate(0, 0); }
  100% { transform: scale(1.12) translate(-2%, 1%); }
}

.bg-vignette {
  position: absolute; inset: 0; z-index: -4;
  background:
    linear-gradient(180deg, rgba(5,11,37,0) 0%, rgba(5,11,37,0.4) 75%, rgba(5,11,37,0.85) 100%),
    radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(5,11,37,0.45) 90%);
  pointer-events: none;
}

/* Aurora-like gradient overlay that breathes with the user */
.aurora-glow {
  position: absolute;
  top: 25%; left: 50%;
  width: 80vw; max-width: 600px;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle,
    rgba(184,232,255,0.32) 0%,
    rgba(108,208,255,0.22) 25%,
    rgba(43,109,217,0.12) 55%,
    transparent 75%);
  z-index: -3;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.6;
}

/* ============ STARS ============ */
.stars {
  position: absolute; inset: 0;
  z-index: -2;
  pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.5) 35%, transparent 70%);
  box-shadow: 0 0 4px rgba(184,232,255,0.6);
}
@keyframes starTwinkle {
  0%, 100% { opacity: var(--peak-opacity, 0.7); transform: scale(1); }
  50%      { opacity: calc(var(--peak-opacity, 0.7) * 0.2); transform: scale(0.6); }
}

/* Shooting stars */
.shooting-star {
  position: absolute;
  width: 80px; height: 1.5px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.95) 65%, #ffffff 100%);
  border-radius: 50%;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.9)) drop-shadow(0 0 6px rgba(184,232,255,0.7));
  pointer-events: none;
  opacity: 0;
}
@keyframes shootingFly {
  0%   { opacity: 0; transform: translate(0,0) rotate(20deg); }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { opacity: 0; transform: translate(280px, 100px) rotate(20deg); }
}

/* Floating dust particles */
.dust {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: rgba(184,232,255,0.8);
  box-shadow: 0 0 3px rgba(184,232,255,0.5);
  pointer-events: none;
}
@keyframes dustFloat {
  0%   { transform: translate(0, 0); opacity: 0; }
  10%  { opacity: var(--peak-opacity, 0.6); }
  90%  { opacity: var(--peak-opacity, 0.6); }
  100% { transform: translate(var(--drift, 30px), -100vh); opacity: 0; }
}

/* ============ SCREENS ============ */
.screen {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  padding: max(env(safe-area-inset-top), 14px) 16px max(env(safe-area-inset-bottom), 14px);
}
.screen.active { display: flex; }

/* WELCOME */
#welcome-screen {
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 18px;
}
.welcome-title {
  font-family: 'Quicksand', sans-serif;
  font-size: clamp(36px, 9.5vw, 48px);
  font-weight: 700;
  line-height: 1.1;
  color: var(--cyan-bright);
  letter-spacing: 0.02em;
  text-shadow: 0 0 24px rgba(108,208,255,0.55), 0 4px 12px rgba(0,0,0,0.5);
  margin-bottom: 4px;
}
.welcome-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-soft);
  max-width: 320px;
  line-height: 1.55;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
.start-button {
  margin-top: 14px;
  padding: 13px 36px;
  background: linear-gradient(180deg, rgba(108,208,255,0.22), rgba(108,208,255,0.05));
  color: var(--cyan-bright);
  font-family: 'Quicksand', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 1.5px solid var(--card-border);
  border-radius: 999px;
  cursor: pointer;
  box-shadow:
    0 0 24px rgba(108,208,255,0.3),
    inset 0 1px 0 rgba(184,232,255,0.25);
  text-shadow: 0 0 10px rgba(108,208,255,0.55);
  transition: all 0.2s ease;
}
.start-button:hover {
  background: linear-gradient(180deg, rgba(108,208,255,0.34), rgba(108,208,255,0.1));
  box-shadow: 0 0 32px rgba(108,208,255,0.5);
}
.start-button:active { transform: scale(0.97); }

/* ============ BREATHING SCREEN ============ */
#breathing-screen {
  justify-content: space-between;
  align-items: stretch;
}

.top-metrics {
  display: flex;
  justify-content: center;
  padding-top: 6px;
}

.metric-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px 12px;
  border-radius: 18px;
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  box-shadow:
    0 0 22px rgba(108,208,255,0.25),
    inset 0 0 14px rgba(108,208,255,0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.metric-icon {
  width: 24px; height: 24px;
  color: var(--cyan);
  filter: drop-shadow(0 0 6px var(--inhale-glow));
}
.metric-content { display: flex; flex-direction: column; line-height: 1; gap: 4px; }
.metric-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-white);
  letter-spacing: -0.01em;
  line-height: 1;
}
.metric-value .unit {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-left: 4px;
  letter-spacing: 0.04em;
}
.metric-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

.app.hide-resp .resp-card { display: none; }

.center-stack {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 0;
  position: relative;
}

.breathing-area {
  position: relative;
  width: min(330px, 78vw);
  aspect-ratio: 1;
  flex-shrink: 1;
}

/* Halo behind circle */
.halo {
  position: absolute; inset: -10%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(108,208,255,0.28) 0%, transparent 60%);
  opacity: 0.5;
  pointer-events: none;
  z-index: 1;
}

/* ============ CHARACTER ============ */
.character-stage {
  position: absolute;
  left: 50%; top: 50%;
  width: 60%;
  aspect-ratio: 360 / 470;
  transform: translate(-50%, -50%);
  z-index: 3;
  pointer-events: none;
}
.character-wrap {
  position: relative;
  width: 100%; height: 100%;
  transform-origin: center 92%;
}
.frame {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  display: block;
  filter: drop-shadow(0 10px 20px rgba(12,27,61,0.6));
  opacity: 0;
  will-change: opacity;
}
/* All frames share the same canvas size (329x439) so they
   overlay perfectly. CSS height is the same; JS sets per-frame scale to
   interpolate the visible character height between adjacent keyframes. */
.frame {
  height: 99.15%;
  width: auto;
  transform: translateX(-50%);
  transform-origin: 50% 100%;  /* scale around bottom-center (feet stay put) */
  will-change: opacity, transform;
}
.f0 { opacity: 1; }  /* start fully exhaled (smallest frame visible) */

/* Subtle breath bob lives on the parent stage so it doesn't fight
   the JS-set scale transform on .character-wrap */
@keyframes breathBob {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50%      { transform: translate(-50%, -50%) translateY(-2px); }
}
.character-stage { animation: breathBob 4.2s ease-in-out infinite; }

/* ============ SMOKE PUFFS ============ */
/* Container anchors at the active frame's spout (JS updates `bottom` per
   breath value). Extends well upward so puffs have room to rise / be drawn in. */
.smoke-container {
  position: absolute;
  left: 50%;
  bottom: 70.34%;    /* initial: matches frame 0 (smallest, fully exhaled) */
  width: 90%;
  height: 220%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 4;
  overflow: visible;
  transition: bottom 0.08s linear;
}
.smoke-puff {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,255,255,1) 0%,
    rgba(230,245,255,0.95) 28%,
    rgba(180,225,255,0.72) 58%,
    rgba(130,200,255,0.32) 82%,
    transparent 100%);
  filter: blur(0.5px);
  pointer-events: none;
  transform: translateX(-50%);
  will-change: transform, opacity;
}

/* ============ BREATHING CIRCLE ============ */
.circle-svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  overflow: visible;
  z-index: 5;
}
.circle-track {
  fill: none;
  stroke: rgba(255,255,255,0.07);
  stroke-width: 2;
}
.arc-inhale {
  fill: none;
  stroke: url(#gradInhale);
  stroke-width: 4.5;
  stroke-linecap: round;
  filter: drop-shadow(0 0 8px var(--inhale-glow));
}
.arc-exhale {
  fill: none;
  stroke: url(#gradExhale);
  stroke-width: 4.5;
  stroke-linecap: round;
  filter: drop-shadow(0 0 8px var(--exhale-glow));
}
.moving-ball {
  fill: var(--cyan-bright);
  filter: drop-shadow(0 0 6px rgba(184,232,255,0.95)) drop-shadow(0 0 14px var(--inhale-glow));
}
.ball-glow {
  fill: rgba(184,232,255,0.35);
  filter: blur(5px);
}

/* Side icons */
.side-icon {
  position: absolute;
  width: 54px; height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  z-index: 6;
  background: rgba(10,20,55,0.78);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: all 0.5s ease;
  opacity: 0.65;
}
.side-icon svg { width: 26px; height: 26px; }

.side-icon-inhale {
  left: -3%; top: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid var(--card-border);
  box-shadow: 0 0 16px rgba(108,208,255,0.3), inset 0 0 12px rgba(108,208,255,0.1);
  color: var(--cyan);
}
.side-icon-exhale {
  right: -3%; top: 50%;
  transform: translate(50%, -50%);
  border: 2px solid rgba(167,139,250,0.5);
  box-shadow: 0 0 16px rgba(167,139,250,0.25), inset 0 0 12px rgba(167,139,250,0.1);
  color: var(--purple);
}

.side-label {
  position: absolute;
  left: 50%;
  top: calc(100% + 8px);
  transform: translateX(-50%);
  text-align: center;
  white-space: nowrap;
}
.side-label .label-name {
  font-family: 'Quicksand', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1;
  display: block;
}
.side-icon-inhale .label-name { color: var(--cyan); }
.side-icon-exhale .label-name { color: var(--purple); }

.breathing-area.phase-inhale .side-icon-inhale {
  opacity: 1;
  box-shadow: 0 0 28px rgba(108,208,255,0.7), 0 0 50px rgba(108,208,255,0.3), inset 0 0 18px rgba(108,208,255,0.25);
  background: rgba(15,40,90,0.85);
}
.breathing-area.phase-inhale .side-icon-inhale svg {
  filter: drop-shadow(0 0 8px rgba(108,208,255,0.85));
}
.breathing-area.phase-exhale .side-icon-exhale {
  opacity: 1;
  box-shadow: 0 0 28px rgba(167,139,250,0.65), 0 0 50px rgba(167,139,250,0.3), inset 0 0 18px rgba(167,139,250,0.2);
  background: rgba(40,30,80,0.85);
}
.breathing-area.phase-exhale .side-icon-exhale svg {
  filter: drop-shadow(0 0 8px rgba(167,139,250,0.85));
}

/* Phase text */
.phase-display {
  text-align: center;
  margin-top: 4px;
  z-index: 4;
}
.phase-text {
  font-family: 'Quicksand', sans-serif;
  font-size: clamp(30px, 8vw, 38px);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1;
  color: var(--cyan-bright);
  text-shadow: 0 0 20px var(--inhale-glow), 0 3px 8px rgba(0,0,0,0.6);
  transition: color 0.5s ease, text-shadow 0.5s ease;
}
.app.phase-exhale .phase-text {
  color: #d4c5ff;
  text-shadow: 0 0 20px var(--exhale-glow), 0 3px 8px rgba(0,0,0,0.6);
}

/* ============ PROGRESS BAR ============ */
.bottom-row { display: flex; justify-content: center; padding: 0 0 10px; }
.progress-card {
  padding: 14px 20px;
  border-radius: 18px;
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  box-shadow:
    0 0 24px rgba(108,208,255,0.28),
    inset 0 0 16px rgba(108,208,255,0.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  width: 100%;
  max-width: 400px;
}
.progress-bar {
  position: relative;
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(108,208,255,0.22);
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
}
.progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg,
    var(--cyan) 0%,
    var(--cyan-bright) 55%,
    var(--purple) 100%);
  box-shadow:
    0 0 12px var(--inhale-glow),
    0 0 22px rgba(167,139,250,0.35);
  transition: width 0.18s linear;
}
/* Soft moving sheen on the leading edge */
.progress-fill::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 24px; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 100%);
  border-radius: 999px;
  opacity: 0.6;
}

/* ============ DONE ============ */
#done-screen { justify-content: center; align-items: center; text-align: center; gap: 20px; }
.done-card {
  padding: 24px 26px 22px;
  border-radius: 24px;
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  box-shadow: 0 0 32px rgba(108,208,255,0.35), inset 0 0 18px rgba(108,208,255,0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  max-width: 320px;
  position: relative;
}
.done-icon-wrap {
  margin: -50px auto 12px;
  width: 70px; height: 70px;
  border-radius: 50%;
  background: rgba(15,40,90,0.85);
  border: 2px solid var(--card-border);
  display: grid;
  place-items: center;
  box-shadow: 0 0 32px rgba(108,208,255,0.6), inset 0 0 18px rgba(108,208,255,0.3);
}
.done-icon { width: 38px; height: 38px; color: var(--cyan-bright); filter: drop-shadow(0 0 8px var(--inhale-glow)); }
.done-title {
  font-family: 'Quicksand', sans-serif;
  font-size: clamp(28px, 7vw, 34px);
  font-weight: 700;
  color: var(--cyan-bright);
  text-shadow: 0 0 20px var(--inhale-glow);
  letter-spacing: 0.02em;
  margin-bottom: 10px;
}
.done-subtitle { font-size: 14px; font-weight: 500; color: var(--text-soft); line-height: 1.45; }
.done-stats {
  display: flex; justify-content: center; gap: 24px;
  margin-top: 18px; padding-top: 14px;
  border-top: 1px solid rgba(108,208,255,0.22);
}
.done-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.done-stat-value { font-size: 22px; font-weight: 700; color: var(--cyan-bright); line-height: 1; }
.done-stat-label {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}

@media (max-height: 720px) {
  .breathing-area { width: min(280px, 70vw); }
  .phase-text { font-size: 28px; }
  .character-stage { width: 56%; }
}
@media (max-width: 380px) {
  .side-icon { width: 46px; height: 46px; }
  .side-icon svg { width: 22px; height: 22px; }
  .metric-card { padding: 8px 14px; }
  .progress-card { padding: 12px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001s !important;
    transition-duration: 0.001s !important;
  }
}

</style>
</head>

<script>
// ============ URL PARAMS ============
function getParam(name, defaultVal) {
  const p = new URLSearchParams(window.location.search);
  return p.has(name) ? p.get(name) : defaultVal;
}
function toBool(v, defaultVal) {
  if (v === undefined || v === null) return defaultVal;
  const s = String(v).toLowerCase();
  return s === '1' || s === 'true' || s === 'yes';
}

const config = {
  inhale:          parseInt(getParam('inhale', 4600), 10),
  exhale:          parseInt(getParam('exhale', 4600), 10),
  count:           parseInt(getParam('count', 33), 10),
  showRespiration: toBool(getParam('showRespiration', '1'), true),
  welcome:         getParam('welcome', 'Drift through the stars and let your breath sync with the cosmos. Each cycle is a calm wave through space.')
};

document.getElementById('welcome-text').textContent = config.welcome;

const app = document.getElementById('app');
if (!config.showRespiration) app.classList.add('hide-resp');

// ============ STARS ============
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const starsContainer = document.getElementById('stars');
const STAR_COUNT = reducedMotion ? 0 : 80;

function rand(min, max) { return min + Math.random() * (max - min); }

for (let i = 0; i < STAR_COUNT; i++) {
  const star = document.createElement('span');
  star.className = 'star';
  // Stars concentrate in the upper 70% (where the sky is)
  star.style.left = rand(0, 100) + '%';
  star.style.top = rand(0, 75) + '%';
  const size = rand(1.5, 3.5);
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  const peakOp = rand(0.5, 0.95);
  star.style.setProperty('--peak-opacity', peakOp.toFixed(2));
  star.style.animation = `starTwinkle ${rand(2, 5).toFixed(1)}s ease-in-out ${(-rand(0,5)).toFixed(1)}s infinite`;
  starsContainer.appendChild(star);
}

// Dust particles (drift slowly upward)
const DUST_COUNT = reducedMotion ? 0 : 18;
for (let i = 0; i < DUST_COUNT; i++) {
  const dust = document.createElement('span');
  dust.className = 'dust';
  dust.style.left = rand(0, 100) + '%';
  dust.style.bottom = '-5px';
  dust.style.setProperty('--peak-opacity', rand(0.3, 0.7).toFixed(2));
  dust.style.setProperty('--drift', (rand(-40, 40)).toFixed(0) + 'px');
  const dur = rand(18, 30);
  dust.style.animation = `dustFloat ${dur.toFixed(1)}s linear ${(-rand(0,dur)).toFixed(1)}s infinite`;
  starsContainer.appendChild(dust);
}

// Periodic shooting stars
function spawnShootingStar() {
  if (reducedMotion) return;
  const ss = document.createElement('span');
  ss.className = 'shooting-star';
  ss.style.left = rand(-5, 70) + '%';
  ss.style.top  = rand(5, 50) + '%';
  ss.style.animation = `shootingFly ${rand(1.2, 1.8).toFixed(1)}s ease-out forwards`;
  starsContainer.appendChild(ss);
  setTimeout(() => ss.remove(), 2000);
}
if (!reducedMotion) {
  function scheduleShoot() {
    spawnShootingStar();
    setTimeout(scheduleShoot, rand(5000, 12000));
  }
  setTimeout(scheduleShoot, 2000);
}

// ============ DOM REFS ============
const ball = document.getElementById('moving-ball');
const ballGlow = document.getElementById('ball-glow');
const breathingArea = document.getElementById('breathing-area');
const phaseText = document.getElementById('phase-text');
const respRateEl = document.getElementById('resp-rate');
const progressFill = document.getElementById('progress-fill');

// Breath-driven elements
const characterWrap = document.getElementById('character-wrap');
const halo = document.getElementById('halo');
const auroraGlow = document.getElementById('aurora-glow');
const smokeContainer = document.getElementById('smoke-container');

// 60 character keyframe images: 9 originals from the reference sprite sheet
// plus 51 interpolated intermediates. Each frame already includes a baked-in
// smoke cloud that grows/shrinks with the body via the crossfade, AND dynamic
// JS puffs additionally rise from / get drawn into the top of the cloud.
const frames = [
  document.querySelector('.f0'),
  document.querySelector('.f1'),
  document.querySelector('.f2'),
  document.querySelector('.f3'),
  document.querySelector('.f4'),
  document.querySelector('.f5'),
  document.querySelector('.f6'),
  document.querySelector('.f7'),
  document.querySelector('.f8'),
];
// Top edge of each frame as a fraction of stage height (470 px). Used to
// position the smoke container so puffs always emerge from / vanish into
// the top of the currently-blended cloud.
// Per-frame visible character height as % of stage height (when frame
// is rendered at scale 1). Used both for the smoke-spawn position and
// for computing the per-frame scale during a crossfade.
const FRAME_VIS_PCT = [70.3352, 79.1839, 82.5872, 86.2174, 87.1249, 90.3014, 95.2929, 95.7467, 99.1500];

// Respiration rate display: simulated sensor reading fluctuating around the
// standard adult resting rate (14 br/min, normal range 12–20). Updates every
// 0.7–1.4 s with a small bounded random walk so it reads like a live monitor.
let currentRespRate = 14.0 + (Math.random() - 0.5) * 2;
function updateRespRate() {
  const delta = (Math.random() - 0.5) * 0.8;
  currentRespRate = Math.max(12, Math.min(17, currentRespRate + delta));
  respRateEl.textContent = currentRespRate.toFixed(1);
}
function tickRespRate() {
  updateRespRate();
  setTimeout(tickRespRate, 700 + Math.random() * 700);
}
tickRespRate();

// ============ HELPERS ============
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

// ============ BREATHING GEOMETRY ============
const CIRCLE_CENTER = 150;
const CIRCLE_RADIUS = 120;
function setBall(angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  const x = CIRCLE_CENTER + CIRCLE_RADIUS * Math.cos(rad);
  const y = CIRCLE_CENTER - CIRCLE_RADIUS * Math.sin(rad);
  ball.setAttribute('cx', x);
  ball.setAttribute('cy', y);
  ballGlow.setAttribute('cx', x);
  ballGlow.setAttribute('cy', y);
}

// Drives breath-tracking visuals from a single normalized value 0..1.
// v = 0: fully exhaled  → frame 1 (smallest, tall narrow)
// v = 1: fully inhaled  → frame 4 (biggest, wide squat)
// Between adjacent frames we crossfade so the change is continuous.
function setBreathValue(v) {
  // v ∈ [0,1]   0 = fully exhaled (smallest)   1 = fully inhaled (biggest)
  // We crossfade between the two adjacent keyframes AND scale each visible
  // frame so its visible character height matches a single interpolated
  // target — that way both visible frames render at the SAME size during
  // the transition, eliminating the "double-image" ghost effect.
  const N = frames.length;
  const phase = Math.max(0, Math.min(N - 1.0001, v * (N - 1)));
  const idx = Math.floor(phase);
  const frac = phase - idx;

  // Target visible character height (% of stage) at this exact moment
  const targetVisPct = lerp(FRAME_VIS_PCT[idx], FRAME_VIS_PCT[idx + 1], frac);

  // Per-frame opacity + scale
  for (let i = 0; i < N; i++) {
    let op = 0, scale = 1;
    if (i === idx) {
      op = 1 - frac;
      scale = targetVisPct / FRAME_VIS_PCT[i];
    } else if (i === idx + 1) {
      op = frac;
      scale = targetVisPct / FRAME_VIS_PCT[i];
    }
    const f = frames[i];
    f.style.opacity = op;
    // Only update transform when visible (op > 0) so we don't pay for hidden frames
    if (op > 0) {
      f.style.transform = `translateX(-50%) scale(${scale.toFixed(4)})`;
    }
  }

  // Smoke container sits at the TOP of the (interpolated) visible character.
  smokeContainer.style.bottom = targetVisPct.toFixed(2) + '%';

  // Halo: brighter and bigger on inhale
  halo.style.opacity = lerp(0.35, 0.85, v);
  halo.style.transform = `scale(${lerp(0.95, 1.05, v)})`;

  // Aurora glow in background
  auroraGlow.style.opacity = lerp(0.35, 0.85, v);
  auroraGlow.style.transform = `translate(-50%, -50%) scale(${lerp(0.9, 1.18, v)})`;
}

// ============ SMOKE PUFFS ============
// Bidirectional smoke:
//   - During EXHALE the droplet emits puffs that spawn at the spout (bottom of
//     smoke-container) and rise upward, growing and fading.
//   - During INHALE the droplet draws puffs IN — they spawn high above the spout
//     and travel downward, shrinking and fading as they reach the spout.
// Spawn rate is significantly higher than before so the effect is prominent.
let lastPuffTime = 0;
let nextPuffDelay = 160;

function spawnExhalePuff() {
  const puff = document.createElement('span');
  puff.className = 'smoke-puff';
  const jitter = rand(-14, 14);
  puff.style.left = `calc(50% + ${jitter}px)`;
  puff.style.bottom = '0px';                       // start at spout level
  const startSize = rand(20, 32);
  puff.style.width = startSize + 'px';
  puff.style.height = startSize + 'px';

  const duration = rand(2000, 2900);
  const driftX = rand(-32, 32);
  const peakScale = rand(2.0, 2.6);

  puff.animate([
    { transform: `translateX(-50%) translate(0,0) scale(0.55)`,                                opacity: 0 },
    { transform: `translateX(-50%) translate(${driftX*0.3}px, -25px) scale(1.0)`,              opacity: rand(0.85, 0.95), offset: 0.15 },
    { transform: `translateX(-50%) translate(${driftX*0.7}px, -130px) scale(${peakScale*0.85})`, opacity: 0.7, offset: 0.6 },
    { transform: `translateX(-50%) translate(${driftX}px, -260px) scale(${peakScale})`,        opacity: 0 }
  ], { duration, easing: 'ease-out', fill: 'forwards' });

  smokeContainer.appendChild(puff);
  setTimeout(() => puff.remove(), duration + 60);
}

function spawnInhalePuff() {
  const puff = document.createElement('span');
  puff.className = 'smoke-puff';
  // Start high up with wider horizontal spread (smoke gathered from afar)
  const startBottom = rand(160, 240);
  const startJitter = rand(-50, 50);
  puff.style.left = `calc(50% + ${startJitter}px)`;
  puff.style.bottom = startBottom + 'px';
  const startSize = rand(26, 38);                  // larger, more visible
  puff.style.width = startSize + 'px';
  puff.style.height = startSize + 'px';

  const duration = rand(1000, 1400);

  puff.animate([
    { transform: `translateX(-50%) translate(0,0) scale(1.0)`,                                       opacity: 0 },
    { transform: `translateX(-50%) translate(${-startJitter*0.45}px, ${startBottom*0.30}px) scale(0.82)`, opacity: rand(0.85, 0.95), offset: 0.2 },
    { transform: `translateX(-50%) translate(${-startJitter*0.85}px, ${startBottom*0.80}px) scale(0.30)`, opacity: 0.55, offset: 0.8 },
    { transform: `translateX(-50%) translate(${-startJitter}px, ${startBottom}px) scale(0.05)`,         opacity: 0 }
  ], { duration, easing: 'ease-in', fill: 'forwards' });

  smokeContainer.appendChild(puff);
  setTimeout(() => puff.remove(), duration + 60);
}

// ============ STATE ============
const state = {
  phase: 'idle',
  phaseStart: 0,
  cycle: 0,
  running: false,
  sessionStart: 0
};

setBall(90); // top
setBreathValue(0); // start fully exhaled — first inhale will expand gradually

function startPhase(phase) {
  state.phase = phase;
  state.phaseStart = performance.now();
  app.classList.remove('phase-inhale', 'phase-exhale');
  breathingArea.classList.remove('phase-inhale', 'phase-exhale');
  if (phase === 'inhale') {
    phaseText.textContent = 'Inhale…';
    app.classList.add('phase-inhale');
    breathingArea.classList.add('phase-inhale');
  } else if (phase === 'exhale') {
    phaseText.textContent = 'Exhale…';
    app.classList.add('phase-exhale');
    breathingArea.classList.add('phase-exhale');
  }
}

function updateProgress(phaseFrac = 0) {
  // phaseFrac is the fraction (0..1) through inhale (counts as first half of cycle)
  // or exhale (second half of cycle). Combined with completed cycles for a
  // smooth bar that advances throughout each breath, not just on cycle boundaries.
  const total = (state.cycle + phaseFrac) / config.count;
  progressFill.style.width = (Math.min(total, 1) * 100).toFixed(2) + '%';
}

function tick(now) {
  if (!state.running) return;
  const elapsed = now - state.phaseStart;

  if (state.phase === 'inhale') {
    const t = Math.min(elapsed / config.inhale, 1);
    const eased = easeInOutSine(t);
    // inhale: top (90) -> left (180) -> bottom (270)
    setBall(90 + eased * 180);
    setBreathValue(eased);  // 0 -> 1
    // Inhale counts as the first half of a cycle for progress purposes
    updateProgress(t * 0.5);
    // Suck-in: puffs spawn high above the cloud and travel DOWN to the cloud's top
    if (now - lastPuffTime > nextPuffDelay) {
      spawnInhalePuff();
      lastPuffTime = now;
      nextPuffDelay = rand(150, 220);
    }
    if (t >= 1) startPhase('exhale');
  } else if (state.phase === 'exhale') {
    const t = Math.min(elapsed / config.exhale, 1);
    const eased = easeInOutSine(t);
    // exhale: bottom (270) -> right (360) -> top (450=90)
    setBall(270 + eased * 180);
    setBreathValue(1 - eased);  // 1 -> 0
    // Exhale is the second half of the cycle
    updateProgress(0.5 + t * 0.5);
    // Emit: puffs spawn at the top of the cloud and rise upward
    if (now - lastPuffTime > nextPuffDelay) {
      spawnExhalePuff();
      lastPuffTime = now;
      nextPuffDelay = rand(120, 180);
    }
    if (t >= 1) {
      state.cycle++;
      updateProgress();
      if (state.cycle >= config.count) return endSession();
      startPhase('inhale');
    }
  }
  requestAnimationFrame(tick);
}

function endSession() {
  state.running = false;
  const duration = (performance.now() - state.sessionStart) / 1000;
  document.getElementById('done-cycles').textContent = state.cycle;
  document.getElementById('done-time').textContent = Math.round(duration) + 's';
  document.getElementById('done-rate').textContent = currentRespRate.toFixed(1);
  document.getElementById('breathing-screen').classList.remove('active');
  setTimeout(() => document.getElementById('done-screen').classList.add('active'), 250);
}

function startSession() {
  state.cycle = 0;
  updateProgress();
  state.running = true;
  state.sessionStart = performance.now();
  startPhase('inhale');
  requestAnimationFrame(tick);
}

document.getElementById('start-button').addEventListener('click', () => {
  document.getElementById('welcome-screen').classList.remove('active');
  setTimeout(() => {
    document.getElementById('breathing-screen').classList.add('active');
    startSession();
  }, 200);
});

</script>
</body>
