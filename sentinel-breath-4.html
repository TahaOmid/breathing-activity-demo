  .bg-haze {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(ellipse at 25% 30%, rgba(70, 160, 220, 0.18) 0%, transparent 40%),
      radial-gradient(ellipse at 75% 60%, rgba(50, 120, 180, 0.14) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 90%, rgba(110, 224, 255, 0.12) 0%, transparent 55%);
    filter: blur(30px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    animation: hazeDrift 24s ease-in-out infinite alternate;
  }
  @keyframes hazeDrift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.06); }
  }

  .bg-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .spark {
    position: absolute;
    bottom: -10px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(160, 240, 255, 0.9);
    box-shadow: 0 0 6px rgba(110, 224, 255, 0.9);
    animation: sparkRise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes sparkRise {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translate(var(--drift, 30px), -110vh); opacity: 0; }
  }

  .bg-scan {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 18%;
    left: -20%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(110, 224, 255, 0.05) 30%,
      rgba(160, 240, 255, 0.14) 50%,
      rgba(110, 224, 255, 0.05) 70%,
      transparent 100%);
    filter: blur(8px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    animation: scanSweep 14s ease-in-out infinite;
  }
  @keyframes scanSweep {
    0%   { left: -20%; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { left: 102%; opacity: 0; }
  }

  /* Vignette: EXPANDS (cyan glow) on inhale, CONTRACTS (darkens) on exhale */
  .bg-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    box-shadow:
      inset 0 0 80px rgba(0, 0, 0, 0.55),
      inset 0 0 140px rgba(0, 10, 25, 0.4);
    will-change: box-shadow;
  }
  .bg-vignette.inhaling { animation: vigExpand   var(--inhale) ease-in-out forwards; }
  .bg-vignette.exhaling { animation: vigContract var(--exhale) ease-in-out forwards; }
  @keyframes vigExpand {
    0%   { box-shadow: inset 0 0 120px rgba(0,0,0,0.75), inset 0 0 220px rgba(0, 0, 0, 0.4); }
    100% { box-shadow: inset 0 0 80px rgba(0,0,0,0.4),  inset 0 0 200px rgba(40, 160, 220, 0.18); }
  }
  @keyframes vigContract {
    0%   { box-shadow: inset 0 0 80px rgba(0,0,0,0.4),  inset 0 0 200px rgba(40, 160, 220, 0.18); }
    100% { box-shadow: inset 0 0 120px rgba(0,0,0,0.75), inset 0 0 220px rgba(0, 0, 0, 0.4); }
  }

  .bg-floor-pool {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28%;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(40, 130, 200, 0.35) 0%,
      rgba(20, 80, 140, 0.15) 35%,
      transparent 70%);
    filter: blur(18px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    animation: poolPulse 8s ease-in-out infinite alternate;
  }
  @keyframes poolPulse {
    0%   { opacity: 0.5; transform: scaleX(0.95); }
    100% { opacity: 0.9; transform: scaleX(1.08); }
  }

  .screen { transition: filter 0.6s ease; }

  /* PRIMARY BREATHING INDICATOR
     INHALE: rings EXPAND outward and brighten
     EXHALE: rings CONTRACT inward and dim */
  .breath-ring {
    position: absolute;
    top: 34.8%;
    left: 47%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    aspect-ratio: 1;
    will-change: width, opacity, border-width, box-shadow;
  }

  .breath-ring.outer {
    width: 22%;
    border: 1.5px solid rgba(110, 224, 255, 0.35);
    box-shadow:
      0 0 30px rgba(110, 224, 255, 0.25),
      inset 0 0 20px rgba(110, 224, 255, 0.1);
    z-index: 3;
  }
  .breath-ring.middle {
    width: 16%;
    border: 2px solid rgba(110, 224, 255, 0.55);
    box-shadow:
      0 0 24px rgba(110, 224, 255, 0.4),
      inset 0 0 16px rgba(110, 224, 255, 0.2);
    z-index: 4;
  }
  .breath-ring.inner {
    width: 10%;
    border: 2.5px solid rgba(160, 238, 255, 0.85);
    box-shadow:
      0 0 32px rgba(160, 238, 255, 0.7),
      inset 0 0 14px rgba(160, 238, 255, 0.5);
    z-index: 5;
    background: radial-gradient(circle,
      rgba(110, 224, 255, 0.3) 0%,
      rgba(110, 224, 255, 0.1) 50%,
      transparent 90%);
  }

  .breath-ring.outer.inhaling  { animation: outerInhale  var(--inhale) ease-in-out forwards; }
  .breath-ring.middle.inhaling { animation: middleInhale var(--inhale) ease-in-out forwards; }
  .breath-ring.inner.inhaling  { animation: innerInhale  var(--inhale) ease-in-out forwards; }
  .breath-ring.outer.exhaling  { animation: outerExhale  var(--exhale) ease-in-out forwards; }
  .breath-ring.middle.exhaling { animation: middleExhale var(--exhale) ease-in-out forwards; }
  .breath-ring.inner.exhaling  { animation: innerExhale  var(--exhale) ease-in-out forwards; }

  @keyframes outerInhale {
    0%   { width: 18%; opacity: 0.15; border-width: 1px; }
    100% { width: 92%; opacity: 0.7;  border-width: 2.5px; }
  }
  @keyframes outerExhale {
    0%   { width: 92%; opacity: 0.7;  border-width: 2.5px; }
    100% { width: 18%; opacity: 0.15; border-width: 1px; }
  }
  @keyframes middleInhale {
    0%   { width: 14%; opacity: 0.3; border-width: 1.5px; }
    100% { width: 64%; opacity: 1;   border-width: 3.5px; }
  }
  @keyframes middleExhale {
    0%   { width: 64%; opacity: 1;   border-width: 3.5px; }
    100% { width: 14%; opacity: 0.3; border-width: 1.5px; }
  }
  @keyframes innerInhale {
    0%   { width: 9%;  opacity: 0.5; border-width: 2px; }
    100% { width: 38%; opacity: 1;   border-width: 4px; }
  }
  @keyframes innerExhale {
    0%   { width: 38%; opacity: 1;   border-width: 4px; }
    100% { width: 9%;  opacity: 0.5; border-width: 2px; }
  }

  /* Chest spotlight */
  .chest-spotlight {
    position: absolute;
    top: 34.8%;
    left: 47%;
    width: 30%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(160, 240, 255, 0.95) 0%,
      rgba(100, 210, 250, 0.6) 18%,
      rgba(50, 170, 230, 0.3) 38%,
      transparent 65%);
    filter: blur(4px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
    z-index: 2;
  }
  .chest-spotlight.inhaling { animation: spotOn  var(--inhale) ease-in-out forwards; }
  .chest-spotlight.exhaling { animation: spotOff var(--exhale) ease-in-out forwards; }
  @keyframes spotOn  { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes spotOff { 0% { opacity: 1; } 100% { opacity: 0; } }

  .eye-glow {
    position: absolute;
    width: 7%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(180, 245, 255, 1) 0%,
      rgba(110, 220, 250, 0.7) 25%,
      rgba(50, 170, 230, 0.3) 55%,
      transparent 80%);
    filter: blur(2px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
    z-index: 3;
  }
  .eye-glow.left  { top: 18.8%; left: 41.9%; }
  .eye-glow.right { top: 18.8%; left: 53.7%; }
  .eye-glow.inhaling { animation: spotOn  var(--inhale) ease-in-out forwards; }
  .eye-glow.exhaling { animation: spotOff var(--exhale) ease-in-out forwards; }

  .floor-glow {
    position: absolute;
    bottom: 13%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 7%;
    background: radial-gradient(ellipse,
      rgba(110, 224, 255, 0.55) 0%,
      rgba(70, 180, 230, 0.2) 45%,
      transparent 80%);
    filter: blur(6px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    will-change: opacity;
    z-index: 3;
  }
  .floor-glow.inhaling { animation: spotOn  var(--inhale) ease-in-out forwards; }
  .floor-glow.exhaling { animation: spotOff var(--exhale) ease-in-out forwards; }

  /* Chest dim - appears on EXHALE (when rings are small) */
  .chest-dim {
    position: absolute;
    top: 34.8%;
    left: 47%;
    width: 12%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(0, 10, 20, 0.7) 0%,
      rgba(0, 10, 20, 0.35) 40%,
      transparent 75%);
    filter: blur(3px);
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: 0;
    will-change: opacity;
    z-index: 2;
  }
  .chest-dim.inhaling { animation: dimOff var(--inhale) ease-in-out forwards; }
  .chest-dim.exhaling { animation: dimOn  var(--exhale) ease-in-out forwards; }
  @keyframes dimOn  { 0% { opacity: 0; }    100% { opacity: 0.85; } }
  @keyframes dimOff { 0% { opacity: 0.85; } 100% { opacity: 0; } }

  .phase-label {
    position: absolute;
    top: 64%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 8;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.45s ease;
  }
  .phase-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.4em;
    padding-left: 0.4em;
    color: var(--cyan-bright);
    text-shadow:
      0 0 24px rgba(110, 224, 255, 0.8),
      0 0 40px rgba(110, 224, 255, 0.5),
      0 2px 10px rgba(0,0,0,0.95);
    text-transform: uppercase;
  }

  .bottom-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 16px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    gap: 14px;
  }

  /* ============== PROMINENT CYCLE DISPLAY ============== */
  .cycle-display {
    text-align: center;
    margin-bottom: 4px;
    padding: 10px 28px 12px;
    background: rgba(8, 14, 22, 0.62);
    border: 1px solid rgba(110, 224, 255, 0.28);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    box-shadow:
      0 6px 28px rgba(0, 0, 0, 0.6),
      0 0 24px rgba(110, 224, 255, 0.18);
    position: relative;
    overflow: hidden;
  }
  .cycle-display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,
      transparent 0%,
      rgba(110, 224, 255, 0.08) 50%,
      transparent 100%);
    pointer-events: none;
  }
  .cycle-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.45em;
    color: var(--cyan-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
    padding-left: 0.45em;
  }
  /* ============== PROGRESS BAR ============== */
  .progress-bar {
    position: relative;
    width: 280px;
    height: 14px;
    margin: 10px 0 8px;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(110, 224, 255, 0.4);
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      inset 0 1px 4px rgba(0, 0, 0, 0.9),
      0 0 12px rgba(110, 224, 255, 0.15);
  }
  /* Subtle tick-mark grid in the track */
  .progress-track {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent calc(100% / 33 - 1px),
      rgba(110, 224, 255, 0.18) calc(100% / 33 - 1px),
      rgba(110, 224, 255, 0.18) calc(100% / 33)
    );
    pointer-events: none;
  }
  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0%;
    background: linear-gradient(90deg,
      rgba(74, 184, 216, 0.85) 0%,
      rgba(110, 224, 255, 1) 55%,
      rgba(160, 238, 255, 1) 100%);
    border-radius: 7px;
    box-shadow:
      0 0 14px rgba(110, 224, 255, 0.85),
      0 0 28px rgba(110, 224, 255, 0.5),
      inset 0 1px 2px rgba(255, 255, 255, 0.35);
    transition: width 0.7s cubic-bezier(0.34, 1.2, 0.5, 1);
    overflow: hidden;
  }
  /* Shimmer running across the filled portion */
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.55) 50%,
      transparent 100%);
    animation: progressShimmer 2.6s ease-in-out infinite;
  }
  @keyframes progressShimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(280%); }
  }
  /* Leading-edge cap that travels with the fill */
  .progress-cap {
    position: absolute;
    top: -3px;
    bottom: -3px;
    left: 0%;
    width: 2px;
    background: rgba(220, 248, 255, 0.95);
    box-shadow:
      0 0 8px rgba(160, 238, 255, 1),
      0 0 18px rgba(110, 224, 255, 0.8);
    transition: left 0.7s cubic-bezier(0.34, 1.2, 0.5, 1);
    opacity: 0;
    pointer-events: none;
  }
  .progress-bar.active .progress-cap { opacity: 1; }
  /* Pulse on each cycle advance */
  .progress-fill.pulse {
    animation: progressPulse 0.55s ease-out;
  }
  @keyframes progressPulse {
    0%   { box-shadow: 0 0 14px rgba(110, 224, 255, 0.85), 0 0 28px rgba(110, 224, 255, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.35); }
    40%  { box-shadow: 0 0 22px rgba(160, 240, 255, 1),    0 0 48px rgba(110, 224, 255, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.6); }
    100% { box-shadow: 0 0 14px rgba(110, 224, 255, 0.85), 0 0 28px rgba(110, 224, 255, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.35); }
  }
  .cycle-sublabel {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.35em;
    color: rgba(232, 238, 242, 0.45);
    text-transform: uppercase;
    margin-top: 3px;
    padding-left: 0.35em;
  }

  /* ============== RESPIRATION READOUT ============== */
  .respiration {
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(110, 224, 255, 0.22);
    padding: 7px 16px 8px;
    border-radius: 6px;
    text-align: center;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .respiration-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    color: var(--cyan-dim);
    text-transform: uppercase;
  }
  .respiration-value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
    min-width: 2.4ch;
    text-align: right;
    text-shadow: 0 0 10px rgba(110, 224, 255, 0.3);
  }
  .respiration-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(232, 238, 242, 0.55);
    text-transform: uppercase;
  }



  /* ============== WELCOME SCREEN (SIMPLIFIED) ============== */
  .welcome {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0, 15, 25, 0.92) 0%, rgba(0, 0, 0, 0.97) 100%);
    backdrop-filter: blur(10px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 38px;
    text-align: center;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  .welcome.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .welcome-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 1.75;
    color: rgba(232, 238, 242, 0.92);
    max-width: 320px;
    margin-bottom: 44px;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
  }
  .begin-btn {
    background: rgba(110, 224, 255, 0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    padding: 15px 42px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
    padding-left: calc(42px + 0.4em);
  }
  .begin-btn:hover {
    background: rgba(110, 224, 255, 0.22);
    box-shadow: 0 0 28px rgba(110, 224, 255, 0.5);
  }

  @media (max-width: 420px) {
    .phase-text { font-size: 26px; }
    .bottom-area { padding: 0 12px 18px; }
    .progress-bar { width: 240px; height: 12px; }
    .welcome-text { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="screen">

  <div class="bg-haze"></div>
  <div class="bg-floor-pool"></div>
  <div class="bg-particles" id="bg-particles"></div>
  <div class="bg-scan"></div>
  <div class="bg-vignette" id="bg-vignette"></div>

  <div class="chest-dim" id="chest-dim"></div>
  <div class="chest-spotlight" id="chest-spotlight"></div>
  <div class="breath-ring outer"  id="ring-outer"></div>
  <div class="breath-ring middle" id="ring-middle"></div>
  <div class="breath-ring inner"  id="ring-inner"></div>
  <div class="eye-glow left"  id="eye-l"></div>
  <div class="eye-glow right" id="eye-r"></div>
  <div class="floor-glow" id="floor"></div>

  <div class="phase-label" id="phase-label">
    <div class="phase-text" id="phase-text">INHALE</div>
  </div>

  <div class="bottom-area">
    <div class="respiration" id="respiration">
      <span class="respiration-label">Respiration Rate</span>
      <span class="respiration-value" id="resp-val">14</span>
      <span class="respiration-unit">br/min</span>
    </div>

    <div class="cycle-display">
      <div class="cycle-label">Cycle Progress</div>
      <div class="progress-bar" id="progress-bar">
        <div class="progress-track"></div>
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-cap" id="progress-cap"></div>
      </div>
      <div class="cycle-sublabel" id="cycle-sublabel">awaiting start</div>
    </div>
  </div>

  <div class="welcome" id="welcome">
    <div class="welcome-text">Breathe with the calm strength of a Sentinel. Inhale protection, exhale tension, and return to balance with each cycle.</div>
    <button class="begin-btn" id="begin-btn">Begin</button>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  let config = {
    inhale: parseInt(params.get('inhale')) || 4600,
    exhale: parseInt(params.get('exhale')) || 4600,
    count: parseInt(params.get('count')) || 33
  };

  function applyTimings() {
    document.documentElement.style.setProperty('--inhale', config.inhale + 'ms');
    document.documentElement.style.setProperty('--exhale', config.exhale + 'ms');
  }
  applyTimings();

  const animatedEls = [
    document.getElementById('ring-outer'),
    document.getElementById('ring-middle'),
    document.getElementById('ring-inner'),
    document.getElementById('chest-spotlight'),
    document.getElementById('chest-dim'),
    document.getElementById('eye-l'),
    document.getElementById('eye-r'),
    document.getElementById('floor'),
    document.getElementById('bg-vignette'),
  ];

  // Atmospheric particles
  const bgParticles = document.getElementById('bg-particles');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (10 + Math.random() * 12) + 's';
    s.style.animationDelay = (Math.random() * 12) + 's';
    s.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    const size = 1 + Math.random() * 2.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.opacity = (0.4 + Math.random() * 0.5).toFixed(2);
    bgParticles.appendChild(s);
  }

  const phaseText = document.getElementById('phase-text');
  const phaseLabel = document.getElementById('phase-label');
  const progressBar = document.getElementById('progress-bar');
  const progressFill = document.getElementById('progress-fill');
  const progressCap = document.getElementById('progress-cap');
  const cycleSublabel = document.getElementById('cycle-sublabel');
  const respVal = document.getElementById('resp-val');

  // Build per-cycle tick marks sized to the actual cycle count
  (function buildTicks() {
    const track = document.querySelector('.progress-track');
    if (!track) return;
    track.style.backgroundImage =
      'repeating-linear-gradient(90deg,' +
      ' transparent 0,' +
      ' transparent calc(100% / ' + config.count + ' - 1px),' +
      ' rgba(110, 224, 255, 0.18) calc(100% / ' + config.count + ' - 1px),' +
      ' rgba(110, 224, 255, 0.18) calc(100% / ' + config.count + '))';
  })();

  let running = false;
  let currentCycle = 0;
  let phaseTimeout = null;
  let respInterval = null;

  // ╔══════════════════════════════════════════════════════════════════╗
  // ║                                                                  ║
  // ║   ★ GARMIN INTEGRATION POINT ★                                   ║
  // ║                                                                  ║
  // ║   TODO(garmin): Replace the placeholder body of                  ║
  // ║   getRespirationRate() below with a real call to the Garmin      ║
  // ║   watch data feed.                                               ║
  // ║                                                                  ║
  // ║   ──────────────────────────────────────────────────────────     ║
  // ║   Data source:    Garmin Connect IQ / Health API                 ║
  // ║   Field needed:   respirationRate                                ║
  // ║   Expected unit:  breaths per minute (Number)                    ║
  // ║   Typical range:  12-20 br/min at rest                           ║
  // ║   Refresh rate:   pulled every 1500ms (see respInterval below)   ║
  // ║   ──────────────────────────────────────────────────────────     ║
  // ║                                                                  ║
  // ║   Synchronous wiring (cached value on device):                   ║
  // ║     function getRespirationRate() {                              ║
  // ║       return garminClient.latest('respirationRate');             ║
  // ║     }                                                            ║
  // ║                                                                  ║
  // ║   Async wiring (REST / Connect IQ message):                      ║
  // ║     async function getRespirationRate() {                        ║
  // ║       const r = await garminClient.fetch('respirationRate');     ║
  // ║       return r.value;                                            ║
  // ║     }                                                            ║
  // ║   If async, also make updateRespiration() await the call.        ║
  // ║                                                                  ║
  // ║   When the Garmin call is in place, delete the placeholder       ║
  // ║   body inside getRespirationRate() (marked PLACEHOLDER below).   ║
  // ║                                                                  ║
  // ╚══════════════════════════════════════════════════════════════════╝
  function getRespirationRate() {
    // ─── PLACEHOLDER ─── replace this body with the Garmin call above.
    // Generates a value that drifts naturally in the 12-18 br/min range
    // so the UI looks alive during development.
    const base = 14;
    const drift = Math.sin(Date.now() / 1800) * 1.4;
    const jitter = (Math.random() - 0.5) * 1.2;
    return base + drift + jitter;
    // ─── END PLACEHOLDER ───
  }

  function updateRespiration() {
    // NOTE(garmin): if getRespirationRate() becomes async, change this to:
    //   const rate = await getRespirationRate();
    // and mark updateRespiration as `async function updateRespiration()`.
    const rate = getRespirationRate();
    respVal.textContent = rate.toFixed(1);
  }
  // ═══════════════ END GARMIN INTEGRATION POINT ═══════════════

  function setPhase(phase) {
    animatedEls.forEach(el => el.classList.remove('inhaling', 'exhaling'));
    void animatedEls[0].offsetWidth;
    if (phase) animatedEls.forEach(el => el.classList.add(phase));
  }

  function setInhale() {
    setPhase('inhaling');
    phaseLabel.style.opacity = '0';
    setTimeout(() => {
      phaseText.textContent = 'INHALE';
      phaseLabel.style.opacity = '1';
    }, 200);
  }

  function setExhale() {
    setPhase('exhaling');
    phaseLabel.style.opacity = '0';
    setTimeout(() => {
      phaseText.textContent = 'EXHALE';
      phaseLabel.style.opacity = '1';
    }, 200);
  }

  function setComplete() {
    setPhase(null);
    animatedEls.forEach(el => el.style.opacity = '');
    document.getElementById('ring-outer').style.cssText  = 'width: 92%; opacity: 0.7; border-width: 2.5px;';
    document.getElementById('ring-middle').style.cssText = 'width: 64%; opacity: 1; border-width: 3.5px;';
    document.getElementById('ring-inner').style.cssText  = 'width: 38%; opacity: 1; border-width: 4px;';
    document.getElementById('chest-spotlight').style.opacity = '1';
    document.getElementById('eye-l').style.opacity = '1';
    document.getElementById('eye-r').style.opacity = '1';
    document.getElementById('floor').style.opacity = '0.7';
    phaseLabel.style.opacity = '0';
    cycleSublabel.textContent = 'session complete';
    // Lock progress bar to full at completion
    progressFill.style.width = '100%';
    progressCap.style.left = '100%';
    setTimeout(() => {
      phaseText.textContent = 'COMPLETE';
      phaseLabel.style.opacity = '1';
    }, 200);
  }

  function updateCycleDisplay() {
    const pct = (currentCycle / config.count) * 100;
    progressFill.style.width = pct + '%';
    progressCap.style.left = pct + '%';
    progressFill.classList.remove('pulse');
    void progressFill.offsetWidth;
    progressFill.classList.add('pulse');
  }

  function runCycle() {
    if (!running) return;
    if (currentCycle >= config.count) {
      setComplete();
      running = false;
      clearInterval(respInterval);
      return;
    }
    currentCycle++;
    updateCycleDisplay();
    setInhale();
    phaseTimeout = setTimeout(() => {
      if (!running) return;
      setExhale();
      phaseTimeout = setTimeout(runCycle, config.exhale);
    }, config.inhale);
  }

  function startSession() {
    running = true;
    currentCycle = 0;
    cycleSublabel.textContent = 'in progress';
    progressFill.style.width = '0%';
    progressCap.style.left = '0%';
    progressBar.classList.add('active');
    animatedEls.forEach(el => el.style.cssText = '');
    updateRespiration();
    respInterval = setInterval(updateRespiration, 1500); // refresh respiration display every 1.5s
    runCycle();
  }

  document.getElementById('begin-btn').addEventListener('click', () => {
    document.getElementById('welcome').classList.add('hidden');
    setTimeout(startSession, 400);
  });

  // Tap to restart once a session has completed
  document.addEventListener('click', (e) => {
    if (e.target.closest('.welcome')) return;
    if (!running && currentCycle >= config.count) startSession();
  });
</script>

</body>
</html>
