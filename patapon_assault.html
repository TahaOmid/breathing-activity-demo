<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Breathing Rite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night-1: #0a0e1c;
    --night-2: #121728;
    --night-3: #1c2238;
    --slate: #2a3148;
    --wall: #232a3f;
    --wall-edge: #14182a;
    --wall-hi: #3a4258;
    --bone: #e8e3d8;
    --bone-mid: rgba(232, 227, 216, 0.7);
    --bone-dim: rgba(232, 227, 216, 0.45);
    --bone-faint: rgba(232, 227, 216, 0.12);
    --bone-trace: rgba(232, 227, 216, 0.06);
    --teal: #7fb8b1;
    --teal-deep: #4a8580;
    --rose: #c4928c;
    --rose-deep: #8a5c57;
    --wood: #3a2818;
    --wood-light: #4a3220;
    --wood-dark: #1f140a;
    --wood-mid: #2e1f10;
    --iron: #0e0c08;
    --iron-light: #3a3328;
    --rope: #6a5b44;
    --rope-light: #8a7860;
    --moon: #d8dcec;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  
  body {
    font-family: 'Fraunces', serif;
    background:
      radial-gradient(ellipse 100% 80% at 50% 0%, rgba(40, 50, 78, 0.5), transparent 70%),
      radial-gradient(ellipse 70% 50% at 75% 20%, rgba(216, 220, 236, 0.05), transparent 70%),
      radial-gradient(ellipse at 50% 50%, var(--night-3), var(--night-1));
    color: var(--bone);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  /* Stars */
  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars::before, .stars::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 8% 7%, #fff, transparent),
      radial-gradient(1px 1px at 22% 16%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 46% 9%, #d8dcec, transparent),
      radial-gradient(1px 1px at 68% 13%, #fff, transparent),
      radial-gradient(1px 1px at 79% 6%, #fff, transparent),
      radial-gradient(1px 1px at 90% 21%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 35% 27%, #fff, transparent),
      radial-gradient(1px 1px at 57% 34%, #d8dcec, transparent),
      radial-gradient(1px 1px at 72% 40%, #fff, transparent),
      radial-gradient(1px 1px at 86% 37%, #fff, transparent),
      radial-gradient(1px 1px at 13% 31%, #fff, transparent),
      radial-gradient(1px 1px at 19% 44%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 93% 15%, #d8dcec, transparent),
      radial-gradient(1px 1px at 42% 50%, #fff, transparent);
    opacity: 0.5;
    animation: twinkle 6s ease-in-out infinite;
  }
  .stars::after {
    animation-delay: -3s;
    background-position: 90px -50px;
    opacity: 0.35;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }
  
  /* Subtle vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 60%, transparent 50%, rgba(10, 14, 28, 0.6) 100%);
    pointer-events: none;
    z-index: 1;
  }
  
  /* ===================== START SCREEN ===================== */
  #start-screen {
    text-align: center;
    z-index: 10;
    max-width: 540px;
    padding: 40px 48px;
    position: relative;
    animation: fadeUp 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .crest {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 44px;
  }
  .crest svg {
    width: 28px;
    height: 36px;
    animation: bob 1.6s ease-in-out infinite;
  }
  .crest svg:nth-child(2) { animation-delay: 0.18s; }
  .crest svg:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  
  .subtitle {
    font-family: 'Inter Tight', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5em;
    color: var(--bone-dim);
    text-transform: uppercase;
    margin-bottom: 28px;
    padding-left: 0.5em;
  }
  
  .lore {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.55;
    color: var(--bone);
    margin-bottom: 52px;
    letter-spacing: 0.01em;
  }
  .lore .b {
    font-style: normal;
    font-weight: 400;
    color: var(--teal);
  }
  .lore .r {
    font-style: normal;
    font-weight: 400;
    color: var(--rose);
  }
  
  #begin-btn {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.4em;
    background: transparent;
    color: var(--bone);
    border: 1px solid var(--bone);
    padding: 16px 42px 14px;
    padding-left: calc(42px + 0.4em);
    border-radius: 999px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.35s ease, color 0.35s ease, transform 0.25s ease;
  }
  #begin-btn:hover {
    background: var(--bone);
    color: var(--night-1);
  }
  #begin-btn:active {
    transform: translateY(1px);
  }
  
  /* ===================== EXERCISE SCREEN ===================== */
  #exercise-screen {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 36px 48px 32px;
    z-index: 10;
    position: relative;
    animation: fadeIn 0.9s ease both;
  }
  #exercise-screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  /* Rate display */
  .rate-block {
    text-align: center;
    position: relative;
  }
  .rate-label {
    font-family: 'Inter Tight', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.45em;
    color: var(--bone-dim);
    text-transform: uppercase;
    padding-left: 0.45em;
    margin-bottom: 10px;
  }
  .rate-number {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 72px;
    line-height: 1;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .rate-unit {
    font-family: 'Inter Tight', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.35em;
    color: var(--bone-dim);
    text-transform: uppercase;
    padding-left: 0.35em;
    margin-top: 12px;
  }
  
  /* Scene */
  .scene {
    flex: 1;
    width: 100%;
    max-width: 1280px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    margin: 8px 0;
  }
  .scene svg {
    width: 100%;
    height: 100%;
    max-height: 62vh;
    display: block;
  }
  
  /* Phase indicator — animates with breath */
  .phase-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 72px;
    margin-bottom: 14px;
  }
  .phase-indicator {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500;
    font-size: 16px;
    text-transform: uppercase;
    transform-origin: center;
    transition: color 0.7s ease;
    will-change: transform, letter-spacing;
    display: inline-block;
  }
  .phase-indicator.inhale { color: var(--teal); }
  .phase-indicator.exhale { color: var(--rose); }
  
  /* Progress bar */
  .progress-track {
    width: 100%;
    max-width: 720px;
    height: 8px;
    background: rgba(232, 227, 216, 0.09);
    border: 1px solid rgba(232, 227, 216, 0.18);
    border-radius: 5px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--bone);
    width: 0%;
    transition: width 0.4s linear;
    box-shadow: 0 0 14px rgba(232, 227, 216, 0.5);
    border-radius: 4px;
  }
  .progress-cap {
    width: 100%;
    display: flex;
    justify-content: space-between;
    max-width: 680px;
    margin-top: 10px;
    font-family: 'Inter Tight', sans-serif;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--bone-dim);
    text-transform: uppercase;
    padding-left: 0.3em;
  }
  
  /* Completion */
  .done-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(28, 34, 56, 0.4), rgba(10, 14, 28, 0.96) 70%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    text-align: center;
    animation: fadeIn 1.3s ease both;
    padding: 40px;
  }
  .done-overlay.show { display: flex; }
  .done-label {
    font-family: 'Inter Tight', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5em;
    color: var(--bone-dim);
    text-transform: uppercase;
    padding-left: 0.5em;
    margin-bottom: 28px;
  }
  .done-line {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 22px;
    color: var(--bone);
    max-width: 460px;
    line-height: 1.5;
    margin-bottom: 48px;
  }
  .done-restart {
    display: none;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="vignette"></div>
  
  <!-- ============ START SCREEN ============ -->
  <div id="start-screen">
    <div class="crest">
      <svg viewBox="-22 -28 44 56" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="0" cy="0" rx="16" ry="20" fill="#0a0e1c"/>

        <line x1="5" y1="20" x2="7" y2="28" stroke="#0a0e1c" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <svg viewBox="-22 -28 44 56" xmlns="http://www.w3.org/2000/svg">

        <line x1="-5" y1="20" x2="-7" y2="28" stroke="#0a0e1c" stroke-width="2.5" stroke-linecap="round"/>

    <div class="subtitle">A Breathing Rite</div>
    
    <p class="lore">
      The gates are sealed.<br>
      <span class="b">Inhale</span> to heave the rope. <span class="r">Exhale</span> to let it fall.
    </p>
    
    <button id="begin-btn">Begin</button>
  </div>
  
  <!-- ============ EXERCISE SCREEN ============ -->
  <div id="exercise-screen">
    <div class="rate-block">
      <div class="rate-label">Respiration Rate</div>
      <div class="rate-number" id="rate">—</div>
      <div class="rate-unit">Breaths per Minute</div>
    </div>
    
    <div class="scene">
      <svg id="scene-svg" viewBox="0 0 1200 540" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Clip the gate so it only shows inside the arch -->
          <clipPath id="arch-clip">
            <path d="M 540 460 L 540 320 A 180 180 0 0 1 900 320 L 900 460 Z"/>
          </clipPath>
          
          <!-- Interior glow when gate is open -->
          <radialGradient id="interior-glow" cx="50%" cy="75%" r="65%">
            <stop offset="0%" stop-color="#7fb8b1" stop-opacity="0.55"/>
            <stop offset="50%" stop-color="#4a8580" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#0a0e1c" stop-opacity="0"/>
          </radialGradient>
          
          <!-- Moon -->
          <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d8dcec" stop-opacity="0.85"/>
            <stop offset="50%" stop-color="#d8dcec" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#d8dcec" stop-opacity="0"/>
          </radialGradient>
          
          <!-- Wood gradient (muted, dark) -->
          <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4a3220"/>
            <stop offset="60%" stop-color="#3a2818"/>
            <stop offset="100%" stop-color="#1f140a"/>
          </linearGradient>
          
          <!-- Wall gradient -->
          <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2e3650"/>
            <stop offset="100%" stop-color="#181d30"/>
          </linearGradient>
          
          <!-- Patapon base -->
          <g id="pp">
            <ellipse cx="0" cy="0" rx="30" ry="38" fill="#0a0e1c"/>
            <circle cx="5" cy="-6" r="16" fill="#e8e3d8"/>
            <circle cx="8" cy="-5" r="7" fill="#0a0e1c"/>
            <circle cx="11" cy="-7" r="2.2" fill="#e8e3d8"/>
          </g>
        </defs>
        
        <!-- ===== SKY ===== -->
        <circle cx="1020" cy="105" r="105" fill="url(#moon-halo)"/>
        <circle cx="1020" cy="105" r="56" fill="#d8dcec"/>
        <circle cx="1000" cy="92" r="8" fill="#b8bccc" opacity="0.4"/>

        <path d="M 0 440 L 100 380 L 220 410 L 340 360 L 480 390 L 620 370 L 760 395 L 920 370 L 1080 390 L 1200 375 L 1200 460 L 0 460 Z"
              fill="#0c1024" opacity="0.8"/>
        
        <!-- ===== INTERIOR (visible through arch) ===== -->
        <g clip-path="url(#arch-clip)">
          <rect x="540" y="140" width="360" height="320" fill="#040712"/>
          <ellipse id="glow" cx="720" cy="420" rx="160" ry="120" fill="url(#interior-glow)" opacity="0"/>
        </g>
        
        <!-- ===== GATE (slides up/down) ===== -->
        <g id="gate-group" clip-path="url(#arch-clip)">
          <g id="gate">
            <!-- Wood body -->
            <rect x="540" y="140" width="360" height="320" fill="url(#wood-grad)"/>

            <line x1="685" y1="175" x2="688" y2="448" stroke="#2e1f10" stroke-width="1" opacity="0.5"/>
            <line x1="745" y1="165" x2="743" y2="450" stroke="#2e1f10" stroke-width="1" opacity="0.5"/>
            <line x1="805" y1="170" x2="808" y2="442" stroke="#2e1f10" stroke-width="1" opacity="0.5"/>
            <line x1="865" y1="175" x2="863" y2="448" stroke="#2e1f10" stroke-width="1" opacity="0.5"/>
            <!-- Heavy iron bands -->
            <rect x="540" y="200" width="360" height="18" fill="#0e0c08"/>
            <rect x="540" y="320" width="360" height="18" fill="#0e0c08"/>
            <rect x="540" y="430" width="360" height="18" fill="#0e0c08"/>
            <!-- Rivets -->
            <circle cx="556" cy="209" r="3.5" fill="#3a3328"/>

        <!-- ===== WALL ===== -->
        <g id="wall">
          <path d="M 280 80 L 1200 80 L 1200 460 L 280 460 Z M 540 460 L 540 320 A 180 180 0 0 1 900 320 L 900 460 Z"

          <!-- Arch frame dark edge -->

          <!-- Stone block lines -->

            <!-- Tribal triangle (rose) -->
            <path d="M -12 -28 L 0 -42 L 12 -28 Z" fill="#c4928c"/>

            <use href="#pp"/>
            <line x1="-8" y1="32" x2="-12" y2="46" stroke="#0a0e1c" stroke-width="4" stroke-linecap="round"/>
            <line x1="8" y1="32" x2="12" y2="46" stroke="#0a0e1c" stroke-width="4" stroke-linecap="round"/>

            <path d="M 0 -28 Q -12 -38 -6 -46 Q 10 -42 10 -28" fill="#7fb8b1"/>
          </g>
        </g>
        
        <!-- Arms (drawn separately in world coords, updated each frame) -->
        <g id="arms" stroke="#0a0e1c" stroke-width="5" stroke-linecap="round" fill="none">
          <line class="arm" data-i="0" data-side="L"/>
          <line class="arm" data-i="0" data-side="R"/>
          <line class="arm" data-i="1" data-side="L"/>
          <line class="arm" data-i="1" data-side="R"/>
          <line class="arm" data-i="2" data-side="L"/>

          <line class="arm" data-i="3" data-side="L"/>
          <line class="arm" data-i="3" data-side="R"/>

    <div class="phase-block">
      <div class="phase-indicator inhale" id="phase">INHALE</div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>

  <!-- ============ DONE OVERLAY ============ -->
  <div class="done-overlay" id="done-overlay">
    <div class="done-label">The Rite Complete</div>
    <div class="done-line">
      The gates remain open. Your tribe steps through, steady and slow.
    </div>
  </div>
  
<script>
(() => {
  // ============== CONFIG ==============
  const INHALE_SEC = 4;
  const EXHALE_SEC = 6;
  const CYCLE_SEC = INHALE_SEC + EXHALE_SEC;
  const TOTAL_CYCLES = 33;
  
  // Patapon positions (5 patapons, left side of scene)
  const PP_BASE_X = [80, 180, 280, 380, 480];
  const PP_BASE_Y = 400;
  
  // Pull mechanics — more dramatic to emphasize the act
  const PULL_SHIFT = 38;        // shift backward (left) when pulling
  const LEAN_DEG = -16;         // body lean back
  const GATE_OPEN = 320;        // gate slide distance up
  
  // Rope geometry — horizontal rope at hand height
  const ANCHOR = { x: 540, y: 295 };
  const ROPE_END_Y_REST = 295;     // y of rope end at rest (horizontal)
  const ROPE_END_Y_PULL = 312;     // y when fully pulled (slight downward strain)
  
  // Marcher patapons (those entering the fort)
  const MARCHER_Y = 418;            // ground line for marchers
  const MARCH_SPEED = 95;           // px/s when gate is open
  const MARCH_THRESHOLD = 0.3;      // pull value at which marchers begin walking
  const MARCH_GATE_X = 540;         // x position of the gate threshold
  const MARCH_GATE_OPEN = 0.55;     // pull value at which marchers may step through the gate
  const MARCH_END_X = 700;          // beyond this, marcher has entered the fort
  const MARCH_FADE_START = 540;     // start fading out as marcher enters arch
  const MARCH_SPAWN_X = -30;        // marcher respawn point (off-screen left)
  
  // Shoulder offsets in body-local space
  const SHOULDER_L = { x: -10, y: -16 };
  const SHOULDER_R = { x: 10, y: -16 };
  
  // ============== ELEMENTS ==============
  const startScreen = document.getElementById('start-screen');
  const exerciseScreen = document.getElementById('exercise-screen');
  const beginBtn = document.getElementById('begin-btn');
  const doneOverlay = document.getElementById('done-overlay');
  const rateEl = document.getElementById('rate');
  const phaseEl = document.getElementById('phase');
  const progressFill = document.getElementById('progress-fill');
  const gateEl = document.getElementById('gate');
  const glow = document.getElementById('glow');
  const rope = document.getElementById('rope');
  const ropeHL = document.getElementById('rope-hl');
  const bodies = document.querySelectorAll('.pp-body');
  const arms = document.querySelectorAll('.arm');
  const marcherEls = document.querySelectorAll('.marcher');
  
  // ============== STATE ==============
  let startTime = null;
  let lastTickMs = null;
  let rafId = null;
  let lastPhase = null;
  
  // Marchers — initial spread across the visible area
  let marcherXs = [430, 280, 130];
  
  // Simulated respiration rate (see DEVELOPER NOTE in tick())
  let simulatedRate = 6.0;
  let lastRateUpdate = 0;
  
  // ============== EASING ==============
  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }
  
  // ============== ANIMATION ==============
  function tick(now) {
    if (startTime === null) startTime = now;
    if (lastTickMs === null) lastTickMs = now;
    const dt = Math.min(0.1, (now - lastTickMs) / 1000);
    lastTickMs = now;
    const elapsedMs = now - startTime;
    const elapsedSec = elapsedMs / 1000;
    
    const cyclesCompleted = Math.floor(elapsedSec / CYCLE_SEC);
    
    if (cyclesCompleted >= TOTAL_CYCLES) {
      finish();
      return;
    }
    
    const cycleTime = elapsedSec - cyclesCompleted * CYCLE_SEC;
    const isInhale = cycleTime < INHALE_SEC;
    const phaseT = isInhale
      ? cycleTime / INHALE_SEC
      : (cycleTime - INHALE_SEC) / EXHALE_SEC;
    
    // pull: 0 = released, 1 = fully heaved
    const pull = isInhale
      ? easeInOutSine(phaseT)
      : 1 - easeInOutSine(phaseT);
    
    // === Phase indicator text (swap on phase change) ===
    const phase = isInhale ? 'inhale' : 'exhale';
    if (phase !== lastPhase) {
      lastPhase = phase;
      phaseEl.textContent = isInhale ? 'INHALE' : 'EXHALE';
      phaseEl.className = `phase-indicator ${phase}`;
    }
    // Animate phase text: scale and letter-spacing breathe with pull
    const phaseScale = 0.85 + 0.55 * pull;     // 0.85 → 1.4
    const phaseSpacing = 0.25 + 0.95 * pull;   // 0.25em → 1.2em
    const phaseOpacity = 0.55 + 0.45 * pull;
    phaseEl.style.transform = `scale(${phaseScale.toFixed(3)})`;
    phaseEl.style.letterSpacing = `${phaseSpacing.toFixed(3)}em`;
    phaseEl.style.opacity = phaseOpacity.toFixed(3);
    
    // === Gate slide ===
    const gateOffsetY = -GATE_OPEN * pull;
    gateEl.setAttribute('transform', `translate(0 ${gateOffsetY.toFixed(2)})`);
    
    // === Interior glow ===
    glow.setAttribute('opacity', (pull * 0.9).toFixed(3));
    
    // === Patapons: position + lean ===
    const shiftX = -PULL_SHIFT * pull;
    const leanDeg = LEAN_DEG * pull;
    const rad = leanDeg * Math.PI / 180;
    const cos = Math.cos(rad);
    const sin = Math.sin(rad);
    // Gentle bob
    const bobBase = Math.sin(elapsedSec * 1.2) * 1.2;
    
    // Compute rope endpoint (at leftmost patapon's grip)
    const leftmostX = PP_BASE_X[0] + shiftX;
    const ropeEndX = leftmostX - 14;  // a touch beyond their left side
    const ropeEndY = ROPE_END_Y_REST + (ROPE_END_Y_PULL - ROPE_END_Y_REST) * pull;
    
    // Draw rope
    rope.setAttribute('x1', ANCHOR.x);
    rope.setAttribute('y1', ANCHOR.y);
    rope.setAttribute('x2', ropeEndX.toFixed(2));
    rope.setAttribute('y2', ropeEndY.toFixed(2));
    ropeHL.setAttribute('x1', ANCHOR.x);
    ropeHL.setAttribute('y1', ANCHOR.y);
    ropeHL.setAttribute('x2', ropeEndX.toFixed(2));
    ropeHL.setAttribute('y2', ropeEndY.toFixed(2));
    
    // For each patapon: position body and draw arms reaching to rope
    bodies.forEach((body, i) => {
      const baseX = PP_BASE_X[i];
      const bob = bobBase + Math.sin(elapsedSec * 2 + i * 0.6) * 1.2;
      const x = baseX + shiftX;
      const y = PP_BASE_Y + bob;
      body.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${leanDeg.toFixed(2)})`);
      
      // Compute world position of both shoulders
      const lsx = x + SHOULDER_L.x * cos - SHOULDER_L.y * sin;
      const lsy = y + SHOULDER_L.x * sin + SHOULDER_L.y * cos;
      const rsx = x + SHOULDER_R.x * cos - SHOULDER_R.y * sin;
      const rsy = y + SHOULDER_R.x * sin + SHOULDER_R.y * cos;
      
      // Hands grip the rope at the shoulder's x position
      // Compute y on rope at given x (rope is straight line from ANCHOR to ropeEnd)
      function ropeYAt(xx) {
        const t = (xx - ANCHOR.x) / (ropeEndX - ANCHOR.x);
        return ANCHOR.y + (ropeEndY - ANCHOR.y) * t;
      }
      const lhx = lsx, lhy = ropeYAt(lsx);
      const rhx = rsx, rhy = ropeYAt(rsx);
      
      // Set arm lines
      const armL = arms[i * 2];
      const armR = arms[i * 2 + 1];
      armL.setAttribute('x1', lsx.toFixed(2));
      armL.setAttribute('y1', lsy.toFixed(2));
      armL.setAttribute('x2', lhx.toFixed(2));
      armL.setAttribute('y2', lhy.toFixed(2));
      armR.setAttribute('x1', rsx.toFixed(2));
      armR.setAttribute('y1', rsy.toFixed(2));
      armR.setAttribute('x2', rhx.toFixed(2));
      armR.setAttribute('y2', rhy.toFixed(2));
    });
    
    // === Marchers — small patapons walking into the fort when gate is open ===
    if (pull > MARCH_THRESHOLD) {
      const speedFactor = Math.min(1, (pull - MARCH_THRESHOLD) / 0.45);
      for (let i = 0; i < marcherXs.length; i++) {
        let proposedX = marcherXs[i] + dt * MARCH_SPEED * speedFactor;
        // Wait at the gate threshold if the gate isn't open enough to step through
        if (marcherXs[i] < MARCH_GATE_X && proposedX > MARCH_GATE_X && pull < MARCH_GATE_OPEN) {
          proposedX = MARCH_GATE_X;
        }
        marcherXs[i] = proposedX;
        if (marcherXs[i] > MARCH_END_X) {
          marcherXs[i] = MARCH_SPAWN_X;  // respawn off-screen left
        }
      }
    }
    marcherEls.forEach((m, i) => {
      const x = marcherXs[i];
      // Opacity fades in at left edge and fades out as they enter the fort
      let opacity = 1;
      if (x < 20) opacity = Math.max(0, (x + 30) / 50);
      if (x > MARCH_FADE_START) opacity = Math.max(0, 1 - (x - MARCH_FADE_START) / (MARCH_END_X - MARCH_FADE_START));
      // Walking bob — only when actively marching, otherwise they stand still
      const bob = pull > MARCH_THRESHOLD ? Math.sin(elapsedSec * 8 + i * 1.6) * 1.5 : 0;
      m.setAttribute('transform', `translate(${x.toFixed(2)} ${(MARCHER_Y + bob).toFixed(2)})`);
      m.setAttribute('opacity', opacity.toFixed(3));
    });
    
    // ================================================================
    // === RESPIRATION RATE ===========================================
    // ================================================================
    // DEVELOPER NOTE — Currently SIMULATED with a small random walk
    // around the target value to mimic live sensor readings.
    //
    // To wire this up to the Garmin watch, REPLACE the simulation
    // block below with the live value from the device API. The value
    // should be a number in breaths per minute (e.g. 6.2).
    //
    //   --- REPLACE THIS BLOCK WITH GARMIN DATA ---
    //   const liveBpm = garminWatch.getRespirationRate();
    //   rateEl.textContent = liveBpm.toFixed(1);
    //   --- END BLOCK ---
    //
    if (elapsedSec - lastRateUpdate > 1.2) {
      const target = 6.0;
      const drift = (target - simulatedRate) * 0.25;
      const jitter = (Math.random() - 0.5) * 0.55;
      simulatedRate = Math.max(5.4, Math.min(6.7, simulatedRate + drift + jitter));
      lastRateUpdate = elapsedSec;
    }
    rateEl.textContent = elapsedSec < 0.5 ? '—' : simulatedRate.toFixed(1);
    
    // === Continuous progress bar ===
    const totalProgress = Math.min(1, elapsedSec / (TOTAL_CYCLES * CYCLE_SEC));
    progressFill.style.width = `${(totalProgress * 100).toFixed(2)}%`;
    
    rafId = requestAnimationFrame(tick);
  }
  
  function finish() {
    // Lock gate open
    gateEl.setAttribute('transform', `translate(0 ${-GATE_OPEN})`);
    glow.setAttribute('opacity', '0.9');
    progressFill.style.width = '100%';
    phaseEl.textContent = 'COMPLETE';
    phaseEl.className = 'phase-indicator';
    phaseEl.style.color = 'var(--bone)';
    phaseEl.style.transform = 'scale(1)';
    phaseEl.style.letterSpacing = '0.5em';
    phaseEl.style.opacity = '1';
    setTimeout(() => doneOverlay.classList.add('show'), 900);
  }
  
  function start() {
    startScreen.style.display = 'none';
    exerciseScreen.classList.add('active');
    startTime = null;
    lastTickMs = null;
    lastPhase = null;
    simulatedRate = 6.0;
    lastRateUpdate = 0;
    marcherXs = [430, 280, 130];
    doneOverlay.classList.remove('show');
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }
  
  beginBtn.addEventListener('click', start);
})();
</script>
