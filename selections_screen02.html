<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1f" />
  <title>Choose your Vibe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-deep:  #0a0a1f;
      --bg-mid:   #1a1438;
      --bg-soft:  #2d1f5a;
      --accent:   #f5d0a9;
      --text:     #f4eef9;
      --text-dim: #b8a8d4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);

      /* Tile sizing — single source of truth so every icon is identical. */
      --tile-size: 140px;

      /* How tightly to crop the artwork inside each tile.
         1.0 = no crop (full image). >1 zooms in and trims the edges. */
      --icon-crop: 1.18;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: calc(20px + var(--safe-top)) 22px calc(40px + var(--safe-bot));
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-soft) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #3a1e5c 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 100%, #1b1745 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      background-attachment: fixed;
      position: relative;
    }

    /* Twinkling starfield */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 18% 22%, rgba(255,255,255,.65) 50%, transparent 51%),
        radial-gradient(1px 1px at 82% 18%, rgba(255,255,255,.45) 50%, transparent 51%),
        radial-gradient(1px 1px at 62% 70%, rgba(255,255,255,.5)  50%, transparent 51%),
        radial-gradient(1px 1px at 28% 82%, rgba(255,255,255,.35) 50%, transparent 51%),
        radial-gradient(1px 1px at 90% 52%, rgba(255,255,255,.5)  50%, transparent 51%),
        radial-gradient(1px 1px at 8%  60%, rgba(255,255,255,.4)  50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 48% 14%, rgba(245,208,169,.55) 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 88%, rgba(255,255,255,.4)  50%, transparent 51%);
      background-size: 720px 720px;
      opacity: .7;
      pointer-events: none;
      animation: twinkle 9s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .55; }
      50%      { opacity: .9;  }
    }

    .header {
      text-align: center;
      margin-bottom: 38px;
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: .85;
      margin-bottom: 10px;
    }
    .title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: clamp(34px, 9.5vw, 48px);
      line-height: 1.2;
      letter-spacing: -.02em;
      background: linear-gradient(180deg, #fff 0%, #d4c5e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .title em {
      font-style: italic;
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
    }
    .subtitle {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 300;
      color: var(--text-dim);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 36px 18px;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .vibe {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      animation:
        float  var(--float-dur, 5s) ease-in-out var(--float-delay, 0s) infinite,
        fadeIn .7s ease-out var(--enter-delay, 0s) forwards;
      will-change: transform, opacity;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-7px) rotate(var(--tilt, .6deg)); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* The "stage": holds the icon + the ground-shadow below it.
       Stage doesn't move; only the icon-wrap inside floats. */
    .stage {
      width: var(--tile-size);
      height: calc(var(--tile-size) + 22px); /* extra room for the shadow */
      position: relative;
      display: flex;
      justify-content: center;
    }

    /* Ground shadow — a soft elliptical pool that subtly pulses
       counter to the float, so the icon feels grounded. */
    .stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 72%;
      height: 14px;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, .55) 0%,
        rgba(0, 0, 0, .28) 40%,
        transparent 72%
      );
      filter: blur(2px);
      animation:
        groundPulse var(--float-dur, 5s) ease-in-out var(--float-delay, 0s) infinite;
      pointer-events: none;
    }
    @keyframes groundPulse {
      0%, 100% {
        opacity: .85;
        transform: translateX(-50%) scale(1);
      }
      50% {
        opacity: .55;
        transform: translateX(-50%) scale(.82);
      }
    }

    .icon-wrap {
      width: var(--tile-size);
      height: var(--tile-size);
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      filter: drop-shadow(0 14px 26px rgba(0,0,0,.5));
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
      /* Clip cropped artwork to a rounded-square tile shape. */
      overflow: hidden;
      border-radius: 22%;
    }
    .vibe:active .icon-wrap { transform: translateX(-50%) scale(.92); }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(var(--icon-crop, 1));
      -webkit-user-drag: none;
      user-select: none;
    }

    .label {
      margin-top: 12px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: .01em;
      color: var(--text);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .vibe, body::before, .stage::after { animation: none !important; }
      .vibe { opacity: 1; }
    }

    /* Narrow phones: shrink tiles a touch so two columns still breathe. */
    @media (max-width: 360px) {
      :root { --tile-size: 120px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1 class="title">Choose your <em>vibe</em></h1>
  </header>

  <main class="grid" id="grid"></main>

  <script>
    /* ============================================================
       ADD A NEW VIBE
       ------------------------------------------------------------
       To add a new app icon + breathing exercise:
         1. Drop the icon image next to this HTML file (or under
            ICON_PATH). Any of .png / .jpg / .jpeg / .webp / .svg
            works. The filename is the "icon" key below.
         2. Append a new object to the APPS array.
              name : label shown under the icon
              icon : filename WITHOUT extension (case-insensitive)
              url  : link to the breathing exercise
              crop : (optional) how tightly to crop this icon.
                       - omit         → use the global --icon-crop default
                       - a number     → exact scale, e.g. 1.0 (no crop),
                                        1.18 (default-ish), 1.30 (tight)
                       - "auto"       → analyse the image's alpha channel
                                        and crop to its non-transparent
                                        content box. Best for PNGs that
                                        have transparent padding.
              glow : (optional) accent colour for the soft halo
                     behind the icon — try an rgba() with low alpha

       Empty placeholder slots are reserved at the bottom of the
       APPS array — uncomment and fill them in to add new vibes
       without touching anything else.

       Icons are auto-sized to --tile-size (see :root). They all
       render at the same dimensions regardless of source size.
       ============================================================ */

    };

    const APPS = [
      {
        name: "UFO",
        icon: "UFO_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/ufo-breath_2.html",
        crop: 1.0,   // UFO sits high in its icon — crop would clip the saucer
        glow: "rgba(140, 255, 160, 0.22)"
      },
      {
        name: "Sentinel",
        icon: "sentinel_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/sentinel-breath-4.html",
        glow: "rgba(100, 220, 255, 0.20)"
      },
      {
        name: "Space Droplet",
        icon: "spaceDroplet_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/spaceDroplet3.html",
        glow: "rgba(120, 180, 255, 0.22)"
      },
      {
        name: "Cosmic Orbit",
        icon: "orbit_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/cosmic-orbit.html",
        glow: "rgba(255, 180, 130, 0.22)"
      },
      {
        name: "Bloom in the Void",
        icon: "flower_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/bloom-in-the-void.html",
        glow: "rgba(255, 160, 220, 0.24)"
      },
      {
        name: "Event Horizon",
        icon: "eventHorizon_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/event-horizon.html",
        glow: "rgba(255, 140, 90, 0.24)"
      },
      {
        name: "Patapon Assault",
        icon: "patapon_appIcon",
        url:  "https://tahaomid.github.io/breathing-activity-demo/patapon_assault.html",
        glow: "rgba(180, 220, 255, 0.20)"
      },

      /* ---------- RESERVED PLACEHOLDER SLOTS ----------
         Uncomment and edit to add new vibes. Duplicate the
         block to create more slots — the grid expands on its own.

      {
        name: "New Vibe Name",
        icon: "myNewIcon_appIcon",
        url:  "https://example.com/my-new-breathing-exercise.html",
        glow: "rgba(200, 200, 255, 0.22)"
      },
      {
        name: "Another Vibe",
        icon: "anotherIcon_appIcon",
        url:  "https://example.com/another-exercise.html",
        glow: "rgba(255, 220, 180, 0.22)"
      },
      */
    ];

    /* ---------- Icon resolution (case-insensitive, format-agnostic) ---------- */

    const ICON_EXTENSIONS = ["png", "webp", "jpg", "jpeg", "svg", "gif"];

    function caseVariants(base) {
      const cap   = s => s ? s[0].toUpperCase() + s.slice(1) : s;
      const decap = s => s ? s[0].toLowerCase() + s.slice(1) : s;
      return [...new Set([
        base,
        base.toLowerCase(),
        base.toUpperCase(),
        cap(base),
        decap(base)
      ])];
    }

    function resolveIconSources(key) {
      // Strip any extension the caller accidentally included.
      const stripped = key.replace(/\.(png|jpe?g|webp|svg|gif)$/i, "");

      // 1) Check the EMBEDDED_ICONS map first (case-insensitive).
      const embeddedKey = stripped.toLowerCase();
      if (EMBEDDED_ICONS[embeddedKey]) {
        return [EMBEDDED_ICONS[embeddedKey]];
      }

      // 2) Fall back to file paths with case + extension variants.
      const bases   = caseVariants(stripped);
      const sources = [];
      for (const base of bases) {
        for (const ext of ICON_EXTENSIONS) {
          sources.push(ICON_PATH + base + "." + ext);
        }
      }
      return sources;
    }

    /* ---------- Crop application ----------
       Three modes, evaluated in order:
         1. `app.crop` is a number → apply that scale directly.
         2. `app.crop === "auto"`  → detect content bbox from the
            image's alpha channel and crop to it. If the image is
            fully opaque (no transparent padding to find), we fall
            back to the global --icon-crop default.
         3. `app.crop` is missing  → leave the global default in place.
    */

    function applyCrop(app, img, wrap) {
      if (typeof app.crop === "number") {
        wrap.style.setProperty("--icon-crop", app.crop);
        return;
      }
      if (app.crop !== "auto") return; // fall through to global default

      const detect = () => {
        const scale = autoDetectCropScale(img);
        if (scale !== null) {
          wrap.style.setProperty("--icon-crop", scale.toFixed(3));
        }
      };
      if (img.complete && img.naturalWidth > 0) {
        detect();
      } else {
        img.addEventListener("load", detect, { once: true });
      }
    }

    function autoDetectCropScale(img) {
      const W = img.naturalWidth, H = img.naturalHeight;
      if (!W || !H) return null;
      try {
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, W, H).data;

        const ALPHA_THRESHOLD = 16; // ignore near-transparent pixels
        let top = H, bottom = -1, left = W, right = -1;

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (data[(y * W + x) * 4 + 3] > ALPHA_THRESHOLD) {
              if (y < top)    top    = y;
              if (y > bottom) bottom = y;
              if (x < left)   left   = x;
              if (x > right)  right  = x;
            }
          }
        }
        if (bottom < 0 || right < 0) return null; // fully transparent

        const contentW = right  - left + 1;
        const contentH = bottom - top  + 1;

        // If the image is essentially full-bleed (no meaningful
        // transparent padding), don't override the global default.
        const FULL_BLEED_THRESHOLD = 0.97;
        if (contentW / W > FULL_BLEED_THRESHOLD &&
            contentH / H > FULL_BLEED_THRESHOLD) {
          return null;
        }

        // Scale so the content box fills the tile (object-fit: cover style).
        const scale = Math.max(W / contentW, H / contentH);
        // Cap so a tiny content region doesn't blow up to absurdity.
        return Math.min(scale, 2.5);
      } catch (e) {
        // CORS-tainted canvas or other failure → silently fall back.
        return null;
      }
    }

    /* ---------- Render ---------- */

    function buildVibe(app, i) {
      const a = document.createElement("a");
      a.className = "vibe";
      a.href = app.url;
      a.setAttribute("aria-label", app.name + " breathing exercise");

      // Per-tile float variation so they don't all bob in sync.
      const floatDur   = (4.6 + (i % 3) * 0.55).toFixed(2) + "s";
      const floatDelay = (i * 0.32).toFixed(2) + "s";
      const tilt       = (i % 2 === 0 ? 0.7 : -0.7) + "deg";
      const enterDelay = (0.08 + i * 0.09).toFixed(2) + "s";
      a.style.setProperty("--float-dur",   floatDur);
      a.style.setProperty("--float-delay", floatDelay);
      a.style.setProperty("--tilt",        tilt);
      a.style.setProperty("--enter-delay", enterDelay);

      // Stage holds the floating icon AND the ground shadow beneath it.
      const stage = document.createElement("div");
      stage.className = "stage";

      const wrap = document.createElement("div");
      wrap.className = "icon-wrap";
      if (app.glow) wrap.style.setProperty("--glow", app.glow);

      const img = document.createElement("img");
      img.alt = app.name;
      img.loading = "lazy";
      img.decoding = "async";

      const sources = resolveIconSources(app.icon);
      let attempt = 0;
      img.src = sources[attempt];
      img.onerror = () => {
        attempt += 1;
        if (attempt < sources.length) {
          img.src = sources[attempt];
        } else {
          img.style.visibility = "hidden";
          console.warn("Icon not found for", app.name, "— tried:", sources);
        }
      };

      wrap.appendChild(img);
      stage.appendChild(wrap);

      // Apply per-icon crop (explicit number, "auto" detect, or default).
      applyCrop(app, img, wrap);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = app.name;

      a.appendChild(stage);
      a.appendChild(label);
      return a;
    }

    const grid = document.getElementById("grid");
    APPS.forEach((app, i) => grid.appendChild(buildVibe(app, i)));
  </script>
