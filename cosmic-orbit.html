<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Breathe — A Cosmic Breathing Exercise</title>
<style>
  /* ============================================================
     RESET & BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ============================================================
     DYNAMIC SPACE BACKGROUND (nebula layer)
     ============================================================ */
  .nebula {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 18% 28%, rgba(95, 45, 160, 0.38) 0%, transparent 50%),
      radial-gradient(ellipse at 82% 68%, rgba(40, 90, 180, 0.32) 0%, transparent 55%),
      radial-gradient(ellipse at 62% 18%, rgba(190, 70, 140, 0.20) 0%, transparent 45%),
      radial-gradient(ellipse at 28% 88%, rgba(35, 110, 190, 0.24) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(20, 10, 50, 0.55) 0%, transparent 70%),
      linear-gradient(180deg, #04061c 0%, #060414 55%, #02030a 100%);
    animation: nebulaShift 48s ease-in-out infinite alternate;
  }
  @keyframes nebulaShift {
    0%   { transform: scale(1)    translate(0, 0);     filter: hue-rotate(0deg); }
    50%  { transform: scale(1.18) translate(2%, -1.5%); filter: hue-rotate(14deg); }
    100% { transform: scale(1.08) translate(-2%, 2%);   filter: hue-rotate(-12deg); }
  }

  /* Starfield canvas */
  canvas#stars {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
  }

  /* ============================================================
     SCREENS
     ============================================================ */
  .screen {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 1s ease;
    padding: 2rem;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ----- Start Screen ----- */
  #start-screen .title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 200;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    text-indent: 0.45em; /* compensate for letter-spacing centering */
    color: #f3f5fb;
    text-shadow: 0 0 35px rgba(180, 200, 255, 0.35);
  }
  #start-screen .subtitle {
    font-size: 0.85rem;
    color: rgba(232, 234, 240, 0.55);
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    text-transform: uppercase;
    margin-bottom: 4.5rem;
    font-weight: 300;
  }

  .begin-button {
    background: transparent;
    border: 1px solid rgba(255, 200, 150, 0.45);
    color: #ffe6c8;
    padding: 1.1rem 3.8rem;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 999px;
    font-weight: 300;
    transition: all 0.5s ease;
    box-shadow:
      0 0 50px rgba(255, 160, 100, 0.18),
      inset 0 0 25px rgba(255, 160, 100, 0.06);
  }
  .begin-button:hover, .begin-button:focus-visible {
    background: rgba(255, 180, 120, 0.09);
    border-color: rgba(255, 210, 170, 0.85);
    color: #fff4dc;
    box-shadow:
      0 0 70px rgba(255, 160, 100, 0.32),
      inset 0 0 30px rgba(255, 160, 100, 0.12);
    transform: scale(1.025);
    outline: none;
  }

  /* ----- Exercise Screen ----- */
  #exercise-screen {
    justify-content: space-between;
    padding: clamp(1.5rem, 4vh, 3rem) 1.5rem;
  }

  .hud-top {
    width: 100%;
    display: flex; justify-content: center;
  }

  .resp-rate {
    text-align: center;
    color: rgba(232, 234, 240, 0.85);
    font-weight: 300;
  }
  .resp-rate .label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 0.55rem;
  }
  .resp-rate .value-row {
    display: inline-flex;
    align-items: baseline;
    gap: 0.4rem;
  }
  .resp-rate .value {
    font-size: 1.7rem;
    font-weight: 200;
    color: #ffe6c8;
    text-shadow: 0 0 20px rgba(255, 180, 120, 0.45);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    min-width: 2ch;
    display: inline-block;
  }
  .resp-rate .unit {
    font-size: 0.6rem;
    opacity: 0.5;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-transform: uppercase;
  }

  /* ----- Orbit Stage ----- */
  .orbit-stage {
    position: relative;
    width: min(560px, 92vw);
    height: min(560px, 58vh);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }

  /* Visible orbital path — foreshortened (tilted) ellipse drawn via SVG */
  .orbit-arc {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    overflow: visible;
    z-index: 1;
  }

  .sun {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff2d1 0%, #ffc183 45%, rgba(255, 160, 90, 0.5) 70%, transparent 90%);
    box-shadow:
      0 0 25px rgba(255, 210, 140, 0.85),
      0 0 60px rgba(255, 170, 90, 0.5),
      0 0 110px rgba(255, 130, 70, 0.25);
    animation: sunPulse 4.5s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes sunPulse {
    0%, 100% { opacity: 0.9; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.18); }
  }

  /* The planet wrapper — JS animates translate/scale on this element.
     The visual sphere is .planet-body, sandwiched between the back-half
     ring SVG (drawn first → behind) and the front-half ring SVG (drawn
     last → in front), creating Saturn-style occlusion. */
  .planet {
    position: absolute;
    width: 96px; height: 96px;
    transform-origin: center;
    will-change: transform;
    z-index: 3;
  }
  .planet-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    /* Beautiful warm gas giant — multiple layered gradients */
    background:
      /* subtle horizontal banding */
      radial-gradient(ellipse 130% 18% at 50% 38%, rgba(255, 220, 180, 0.22), transparent 60%),
      radial-gradient(ellipse 130% 14% at 50% 52%, rgba(120, 40, 20, 0.32), transparent 60%),
      radial-gradient(ellipse 130% 16% at 50% 66%, rgba(200, 90, 50, 0.20), transparent 60%),
      radial-gradient(ellipse 130% 12% at 50% 78%, rgba(80, 25, 10, 0.30), transparent 60%),
      /* main sphere shading: highlight upper-left, deep shadow lower-right */
      radial-gradient(circle at 30% 27%,
        #fff2d8 0%,
        #ffd6a3 14%,
        #ff9c6a 34%,
        #e25a30 60%,
        #8c2412 86%,
        #3a0a05 100%);
    box-shadow:
      inset -16px -20px 38px rgba(15, 0, 0, 0.65),
      inset 6px 9px 22px rgba(255, 230, 200, 0.18),
      0 0 55px rgba(255, 130, 70, 0.5),
      0 0 140px rgba(255, 90, 50, 0.28);
  }
  /* Saturn-style planetary ring system — two SVGs, one rendered behind
     the planet body (top arcs) and one in front (bottom arcs), so the
     ring naturally passes behind and over the planet body. */
  .planet-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 250%;
    height: 250%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    overflow: visible;
  }
  /* a soft specular highlight */
  .planet-body::after {
    content: '';
    position: absolute;
    top: 14%; left: 18%;
    width: 32%; height: 22%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 245, 220, 0.42), transparent 70%);
    pointer-events: none;
    filter: blur(2px);
  }

  /* ----- Animated Atmospheric Bands -----
     Two layers of soft swirling storm patches drifting in opposite
     directions at different speeds — evoking Jupiter-style differential
     atmospheric rotation. Each layer is twice as wide as the planet, with
     its pattern duplicated at +50%, so a translateX of -50% loops seamlessly. */
  .gas-flow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .gas-flow::before,
  .gas-flow::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 200%; height: 100%;
    will-change: transform;
  }
  /* Upper band — cream / amber swirls, slow westward drift */
  .gas-flow::before {
    background-image:
      radial-gradient(ellipse 8% 4% at  6% 28%, rgba(255, 235, 205, 0.20), transparent 70%),
      radial-gradient(ellipse 6% 3% at 17% 36%, rgba( 80,  30,  15, 0.22), transparent 70%),
      radial-gradient(ellipse 9% 5% at 28% 30%, rgba(255, 215, 175, 0.24), transparent 70%),
      radial-gradient(ellipse 7% 4% at 40% 38%, rgba(120,  50,  25, 0.20), transparent 70%),
      /* duplicates shifted +50% — required for seamless looping */
      radial-gradient(ellipse 8% 4% at 56% 28%, rgba(255, 235, 205, 0.20), transparent 70%),
      radial-gradient(ellipse 6% 3% at 67% 36%, rgba( 80,  30,  15, 0.22), transparent 70%),
      radial-gradient(ellipse 9% 5% at 78% 30%, rgba(255, 215, 175, 0.24), transparent 70%),
      radial-gradient(ellipse 7% 4% at 90% 38%, rgba(120,  50,  25, 0.20), transparent 70%);
    animation: gasFlow 8s linear infinite;
  }
  /* Lower band — deeper crimson/rust streaks, faster eastward drift */
  .gas-flow::after {
    background-image:
      radial-gradient(ellipse 9% 5% at  8% 60%, rgba(200,  90,  50, 0.22), transparent 70%),
      radial-gradient(ellipse 7% 4% at 20% 66%, rgba( 60,  20,  10, 0.26), transparent 70%),
      radial-gradient(ellipse 10% 5% at 34% 62%, rgba(220, 110,  60, 0.20), transparent 70%),
      radial-gradient(ellipse 6% 4% at 46% 70%, rgba( 80,  30,  15, 0.24), transparent 70%),
      radial-gradient(ellipse 9% 5% at 58% 60%, rgba(200,  90,  50, 0.22), transparent 70%),
      radial-gradient(ellipse 7% 4% at 70% 66%, rgba( 60,  20,  10, 0.26), transparent 70%),
      radial-gradient(ellipse 10% 5% at 84% 62%, rgba(220, 110,  60, 0.20), transparent 70%),
      radial-gradient(ellipse 6% 4% at 96% 70%, rgba( 80,  30,  15, 0.24), transparent 70%);
    animation: gasFlow 5.5s linear infinite reverse;
  }
  @keyframes gasFlow {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  /* Honor reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    .gas-flow::before,
    .gas-flow::after { animation: none; }
  }

  /* ----- Instruction Text ----- */
  .instruction {
    color: rgba(245, 247, 252, 0.92);
    font-size: clamp(1.2rem, 3.2vw, 1.7rem);
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    text-transform: uppercase;
    font-weight: 200;
    text-align: center;
    text-shadow: 0 0 28px rgba(180, 200, 255, 0.4);
    min-height: 2.2rem;
    transition: opacity 0.7s ease;
  }

  /* ----- Progress ----- */
  .progress-wrap {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(232, 234, 240, 0.10);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.05),
      0 0 20px rgba(255, 180, 100, 0.08);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
      rgba(255, 140, 80, 0.85) 0%,
      rgba(255, 200, 140, 1) 60%,
      rgba(255, 235, 200, 1) 100%);
    box-shadow:
      0 0 22px rgba(255, 180, 100, 0.85),
      0 0 44px rgba(255, 150, 90, 0.35);
    border-radius: 999px;
    transition: width 0.4s linear;
  }

  /* ----- End Screen ----- */
  #end-screen .glow-orb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff2d1 0%, #ffc183 50%, transparent 75%);
    box-shadow:
      0 0 35px rgba(255, 210, 140, 0.85),
      0 0 90px rgba(255, 170, 90, 0.5),
      0 0 160px rgba(255, 130, 70, 0.25);
    margin-bottom: 3rem;
    animation: sunPulse 4.5s ease-in-out infinite;
  }
  #end-screen .complete {
    font-size: clamp(1.3rem, 3.6vw, 1.8rem);
    font-weight: 200;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    color: #fff4dc;
    text-shadow: 0 0 32px rgba(255, 200, 150, 0.45);
    margin-bottom: 1.1rem;
    text-align: center;
  }
  #end-screen .sub {
    color: rgba(232, 234, 240, 0.55);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    font-size: 0.8rem;
    text-transform: uppercase;
    font-weight: 300;
    text-align: center;
  }

  @media (max-width: 600px) {
    .planet { width: 72px; height: 72px; }
    .instruction { letter-spacing: 0.4em; text-indent: 0.4em; }
  }
</style>
</head>
<body>

<!-- Animated nebula -->
<div class="nebula" aria-hidden="true"></div>

<!-- Starfield -->
<canvas id="stars" aria-hidden="true"></canvas>

<!-- ============================================================
     START SCREEN
     ============================================================ -->
<div id="start-screen" class="screen" role="dialog" aria-label="Start breathing exercise">
  <div class="title">Breathe</div>
  <div class="subtitle">A journey through the stars</div>
  <button class="begin-button" id="beginBtn" type="button">Begin</button>
</div>

<!-- ============================================================
     EXERCISE SCREEN
     ============================================================ -->
<div id="exercise-screen" class="screen hidden" aria-label="Breathing exercise in progress">

  <!-- ====================================================
       RESPIRATION RATE FROM GARMIN WATCH — DEVELOPER NOTE
       ====================================================
       The live respiration rate from the Garmin watch is
       displayed inside the span with id="respRateValue".
       To update it, call:
           updateRespirationRate(bpm)
       where `bpm` is the latest breaths-per-minute reading.
       See the matching block in the <script> section below.
       ==================================================== -->
  <div class="hud-top">
    <div class="resp-rate">
      <span class="label">Respiration Rate</span>
      <span class="value-row">
        <!-- Garmin respiration rate value is rendered here -->
        <span class="value" id="respRateValue">--</span>
        <span class="unit">br / min</span>
      </span>
    </div>
  </div>

  <!-- Orbit stage: contains central sun and the orbiting planet -->
  <div class="orbit-stage" id="orbitStage">
    <!-- Perspective orbital path: a foreshortened ellipse.
         Gradient stroke fades into the distance at the top and
         brightens toward the foreground at the bottom. -->
    <svg class="orbit-arc" id="orbitSvg" aria-hidden="true">
      <defs>
        <linearGradient id="orbitGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="rgba(180, 200, 240, 0.04)" />
          <stop offset="50%"  stop-color="rgba(210, 225, 255, 0.16)" />
          <stop offset="100%" stop-color="rgba(230, 240, 255, 0.34)" />
        </linearGradient>
      </defs>
      <ellipse id="orbitEllipse" cx="0" cy="0"
               stroke="url(#orbitGrad)" fill="none" stroke-width="1.2" />
    </svg>
    <div class="sun" aria-hidden="true"></div>
    <div class="planet" id="planet" aria-hidden="true">

      <!-- Back half of asteroid belt — asteroids whose y < 0 (top arc),
           drawn first so the planet body occludes the central portion. -->
      <svg class="planet-ring planet-ring-back" id="ringBack"
           viewBox="-120 -120 240 240" aria-hidden="true"></svg>

      <!-- The planet body — sphere + animated atmospheric bands -->
      <div class="planet-body">
        <div class="gas-flow" aria-hidden="true"></div>
      </div>

      <!-- Front half of asteroid belt — asteroids whose y > 0 (bottom
           arc), drawn last so they pass over the planet's lower half. -->
      <svg class="planet-ring planet-ring-front" id="ringFront"
           viewBox="-120 -120 240 240" aria-hidden="true"></svg>

    </div>
  </div>

  <!-- Inhale / Exhale instruction -->
  <div class="instruction" id="instruction">Inhale</div>

  <!-- Progress bar — 33 cycles -->
  <div class="progress-wrap">
    <div class="progress-bar" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<!-- ============================================================
     END SCREEN (no replay / begin-again button)
     ============================================================ -->
<div id="end-screen" class="screen hidden" aria-label="Session complete">
  <div class="glow-orb" aria-hidden="true"></div>
  <div class="complete">Session complete</div>
  <div class="sub">Be well</div>
</div>

<script>
(() => {
  'use strict';

  /* ==========================================================
     CONFIGURATION
     ========================================================== */
  const TOTAL_CYCLES = 33;
  const INHALE_MS    = 4000;   // 4 seconds inhale
  const EXHALE_MS    = 6000;   // 6 seconds exhale
  const CYCLE_MS     = INHALE_MS + EXHALE_MS;

  /* ==========================================================
     DOM REFERENCES
     ========================================================== */
  const planet         = document.getElementById('planet');
  const orbitStage     = document.getElementById('orbitStage');
  const orbitSvg       = document.getElementById('orbitSvg');
  const orbitEllipse   = document.getElementById('orbitEllipse');
  const instruction    = document.getElementById('instruction');
  const progressFill   = document.getElementById('progressFill');
  const respRateValue  = document.getElementById('respRateValue');

  const startScreen    = document.getElementById('start-screen');
  const exerciseScreen = document.getElementById('exercise-screen');
  const endScreen      = document.getElementById('end-screen');
  const beginBtn       = document.getElementById('beginBtn');

  /* ==========================================================
     STARFIELD (canvas)
     ========================================================== */
  const canvas = document.getElementById('stars');
  const ctx    = canvas.getContext('2d');
  let stars         = [];
  let shootingStars = [];
  let dpr           = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initStars() {
    stars = [];
    const density = Math.floor((window.innerWidth * window.innerHeight) / 3800);
    for (let i = 0; i < density; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.4 + 0.25,
        baseAlpha: Math.random() * 0.7 + 0.25,
        twinkleSpeed: Math.random() * 0.0022 + 0.0006,
        phase: Math.random() * Math.PI * 2,
        // hue: 0 = white, 1 = cool blue, 2 = warm amber
        hue: Math.random() < 0.82 ? 0 : (Math.random() < 0.55 ? 1 : 2)
      });
    }
  }

  function maybeSpawnShootingStar() {
    if (Math.random() < 0.0009 && shootingStars.length < 2) {
      const fromLeft = Math.random() < 0.5;
      shootingStars.push({
        x: fromLeft ? -20 : window.innerWidth + 20,
        y: Math.random() * window.innerHeight * 0.55,
        vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 3.5),
        vy: 1.2 + Math.random() * 1.5,
        life: 1,
        trail: []
      });
    }
  }

  function drawShootingStars() {
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 22) s.trail.shift();
      s.x += s.vx;
      s.y += s.vy;
      s.life -= 0.012;

      for (let j = 0; j < s.trail.length; j++) {
        const t = s.trail[j];
        const alpha = (j / s.trail.length) * s.life * 0.85;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 240, 220, ${alpha})`;
        ctx.fill();
      }

      if (s.life <= 0 || s.x < -50 || s.x > window.innerWidth + 50 || s.y > window.innerHeight + 50) {
        shootingStars.splice(i, 1);
      }
    }
  }

  function renderStars(t) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (const s of stars) {
      const twinkle = 0.6 + 0.4 * Math.sin(t * s.twinkleSpeed + s.phase);
      const alpha = s.baseAlpha * twinkle;
      let color;
      if (s.hue === 1)      color = `rgba(180, 210, 255, ${alpha})`;
      else if (s.hue === 2) color = `rgba(255, 220, 180, ${alpha})`;
      else                  color = `rgba(245, 248, 255, ${alpha})`;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // soft halo for brighter stars
      if (s.r > 1.1) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2);
        ctx.fillStyle = color.replace(/[\d.]+\)$/, (alpha * 0.16).toFixed(3) + ')');
        ctx.fill();
      }
    }

    maybeSpawnShootingStar();
    drawShootingStars();
  }

  /* ==========================================================
     ORBIT DIMENSIONS (responsive)
     ========================================================== */
  /* ==========================================================
     ANIMATED ASTEROID BELT (planet's equatorial plane)
     Each logical asteroid gets TWO SVG instances — one in the
     back-layer SVG (rendered behind the planet body) and one in
     the front-layer SVG (in front). Both circles follow the same
     elliptical animateMotion path with identical duration and
     begin offset. Their opacity is animated as a crossfade so
     that — at any moment — the visible portion sums to the
     asteroid's full brightness, but the planet body occludes the
     back instance when it passes "behind" the sphere.

     Orbital path traversal (sweep flag 0 = CCW on screen):
       t=0%   right horizon (y=0)
       t=25%  apex of back arc  (top, y<0)
       t=50%  left horizon
       t=75%  apex of front arc (bottom, y>0)
       t=100% back to right horizon
     ========================================================== */
  function generateAsteroidBelt() {
    const backSvg  = document.getElementById('ringBack');
    const frontSvg = document.getElementById('ringFront');
    if (!backSvg || !frontSvg) return;

    while (backSvg.firstChild)  backSvg.removeChild(backSvg.firstChild);
    while (frontSvg.firstChild) frontSvg.removeChild(frontSvg.firstChild);

    const svgNS = 'http://www.w3.org/2000/svg';
    const TILT  = 0.32;          // matches the orbital-plane foreshortening
    const NUM   = 140;            // logical asteroids (× 2 SVG instances)

    // Shared crossfade keyTimes: a small dead-zone around each horizon
    // crossing so the planet's occlusion takeover feels smooth.
    const KEY_TIMES = '0;0.03;0.47;0.5;0.53;0.97;1';
    // Back instance: visible across the back arc (0–50%), invisible across front
    const BACK_VALUES  = '0.5;1;1;0.5;0;0;0.5';
    // Front instance: opposite — values sum to 1.0 with BACK_VALUES at every step
    const FRONT_VALUES = '0.5;0;0;0.5;1;1;0.5';

    for (let i = 0; i < NUM; i++) {
      // Pick a ring zone (C / B / A) with realistic density weighting
      const zone = Math.random();
      let rxBase, brightness;

      if (zone < 0.22) {
        // Inner C-ring — sparse, dim
        rxBase     = 58 + Math.random() * 13;
        brightness = 0.25 + Math.random() * 0.30;
      } else if (zone < 0.74) {
        // Main B-ring — densest, brightest
        rxBase     = 73 + Math.random() * 16;
        brightness = 0.55 + Math.random() * 0.40;
      } else {
        // Outer A-ring — separated from B by a small Cassini gap
        rxBase     = 93 + Math.random() * 16;
        brightness = 0.40 + Math.random() * 0.35;
      }

      const rx = rxBase;
      const ry = rx * TILT;

      const dur   = 18 + Math.random() * 14;    // 18 – 32 s orbital period
      const begin = -Math.random() * dur;        // staggered starting phase
      const size  = 0.35 + Math.random() * 0.95; // 0.35 – 1.3 (viewBox units)

      const red   = 234 + Math.floor(Math.random() * 21);
      const green = 215 + Math.floor(Math.random() * 24);
      const blue  = 175 + Math.floor(Math.random() * 38);

      // Elliptical orbital path centered on the planet
      const path =
        `M ${rx.toFixed(1)},0 ` +
        `A ${rx.toFixed(1)},${ry.toFixed(1)} 0 1 0 ${(-rx).toFixed(1)},0 ` +
        `A ${rx.toFixed(1)},${ry.toFixed(1)} 0 1 0 ${rx.toFixed(1)},0`;

      const fill = `rgba(${red},${green},${blue},${brightness.toFixed(2)})`;

      backSvg.appendChild(
        buildAsteroidInstance(svgNS, size, fill, path, dur, begin, BACK_VALUES, KEY_TIMES)
      );
      frontSvg.appendChild(
        buildAsteroidInstance(svgNS, size, fill, path, dur, begin, FRONT_VALUES, KEY_TIMES)
      );
    }
  }

  /* Helper — builds one SVG circle with animateMotion + opacity fade */
  function buildAsteroidInstance(svgNS, size, fill, path, dur, begin, values, keyTimes) {
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('r', size.toFixed(2));
    circle.setAttribute('fill', fill);

    const motion = document.createElementNS(svgNS, 'animateMotion');
    motion.setAttribute('dur', `${dur.toFixed(2)}s`);
    motion.setAttribute('repeatCount', 'indefinite');
    motion.setAttribute('path', path);
    motion.setAttribute('begin', `${begin.toFixed(2)}s`);

    const opacity = document.createElementNS(svgNS, 'animate');
    opacity.setAttribute('attributeName', 'opacity');
    opacity.setAttribute('values', values);
    opacity.setAttribute('keyTimes', keyTimes);
    opacity.setAttribute('dur', `${dur.toFixed(2)}s`);
    opacity.setAttribute('repeatCount', 'indefinite');
    opacity.setAttribute('begin', `${begin.toFixed(2)}s`);

    circle.appendChild(motion);
    circle.appendChild(opacity);
    return circle;
  }

  function getOrbitDims() {
    const size = Math.min(orbitStage.clientWidth, orbitStage.clientHeight);
    const rx = size * 0.44;           // horizontal semi-axis (orbit width)
    const ry = rx * 0.32;             // vertical semi-axis — foreshortened for perspective tilt
    return {
      rx, ry,
      maxScale: 1.75,                 // planet's largest (closest to camera) appearance
      minScale: 0.38                  // planet's smallest (most distant) appearance
    };
  }

  /* Size the perspective ellipse to match the current orbit dimensions */
  function sizeOrbitRing() {
    const dims = getOrbitDims();
    const w = dims.rx * 2 + 8;
    const h = dims.ry * 2 + 8;
    orbitSvg.setAttribute('width', w);
    orbitSvg.setAttribute('height', h);
    orbitSvg.setAttribute('viewBox', `${-w / 2} ${-h / 2} ${w} ${h}`);
    orbitEllipse.setAttribute('rx', dims.rx);
    orbitEllipse.setAttribute('ry', dims.ry);
  }

  /* Smooth bell-curve easing for natural breath flow */
  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  /* ==========================================================
     ====================================================
     RESPIRATION RATE FROM GARMIN WATCH — INTEGRATION POINT
     ====================================================
     Replace the demo updater below with the live data feed
     from the Garmin watch. Whenever a new respiration rate
     reading is received, call:

         updateRespirationRate(bpm);

     where `bpm` is the current breaths-per-minute value
     (a number, e.g. 13.4).
     ====================================================
     ========================================================== */
  function updateRespirationRate(bpm) {
    if (bpm == null || isNaN(bpm)) {
      respRateValue.textContent = '--';
      return;
    }
    respRateValue.textContent = Math.round(bpm);
  }

  // Expose globally so an external script / SDK can call it.
  window.updateRespirationRate = updateRespirationRate;

  // --- DEMO ONLY: simulate a Garmin-style live feed ------------
  // Remove this block when wiring up the real Garmin data source.
  let demoRate = 14;
  let demoTimer = setInterval(() => {
    demoRate += (Math.random() - 0.5) * 0.9;
    demoRate = Math.max(9, Math.min(20, demoRate));
    updateRespirationRate(demoRate);
  }, 1400);
  updateRespirationRate(demoRate);
  // --- /DEMO ---------------------------------------------------

  /* ==========================================================
     EXERCISE STATE & ANIMATION LOOP
     ========================================================== */
  let exerciseStartTime = 0;
  let exerciseActive    = false;
  let exerciseEnded     = false;
  let lastPhase         = '';

  function setPlanetTransform(x, y, scale) {
    planet.style.transform =
      `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
  }

  // Place planet absolutely centered, then JS offsets it.
  // (Override centering via the transform above.)
  planet.style.left = '50%';
  planet.style.top  = '50%';
  planet.style.marginLeft = '0';
  planet.style.marginTop  = '0';

  function animate(now) {
    renderStars(now);

    if (exerciseActive) {
      const elapsed = now - exerciseStartTime;
      const cycleIndex = Math.floor(elapsed / CYCLE_MS);

      if (cycleIndex >= TOTAL_CYCLES) {
        endExercise();
      } else {
        const cycleElapsed = elapsed % CYCLE_MS;
        let phase, phaseT, breath;

        if (cycleElapsed < INHALE_MS) {
          phase  = 'inhale';
          phaseT = cycleElapsed / INHALE_MS;
          breath = easeInOutSine(phaseT);          // 0 → 1
        } else {
          phase  = 'exhale';
          phaseT = (cycleElapsed - INHALE_MS) / EXHALE_MS;
          breath = 1 - easeInOutSine(phaseT);      // 1 → 0
        }

        // Update instruction only on phase change to avoid layout churn
        if (phase !== lastPhase) {
          instruction.textContent = phase === 'inhale' ? 'Inhale' : 'Exhale';
          lastPhase = phase;
        }

        // The planet traces one full revolution per breath cycle along a fixed
        // foreshortened ellipse. `breath` is the eased progress through the
        // current phase (0→1 over inhale, 1→0 over exhale).
        //
        //   Inhale  (4s):  angle sweeps -π/2 → +π/2
        //                  — from the BACK of the orbit (top, distant)
        //                    around one side to the FRONT (bottom, near).
        //   Exhale  (6s):  angle sweeps +π/2 → +3π/2
        //                  — from the front around the other side back to
        //                    the distant top.
        //
        // The planet's apparent size is derived from sin(angle): closest to
        // camera at the front of the ellipse (sin=+1), farthest at the back
        // (sin=-1). That gives the natural "growing as it nears, shrinking as
        // it recedes" perspective on a single fixed orbital path.
        const dims = getOrbitDims();
        let angle;
        if (phase === 'inhale') {
          angle = -Math.PI / 2 + Math.PI * breath;
        } else {
          angle = Math.PI / 2 + Math.PI * (1 - breath);
        }

        const x = Math.cos(angle) * dims.rx;
        const y = Math.sin(angle) * dims.ry;

        const depth = Math.sin(angle);          // -1 (far) … +1 (near)
        const t01   = (depth + 1) / 2;          //  0 (far) …  1 (near)
        const scale = dims.minScale + (dims.maxScale - dims.minScale) * t01;

        setPlanetTransform(x, y, scale);

        // Progress through the full session
        const totalProgress = elapsed / (CYCLE_MS * TOTAL_CYCLES);
        progressFill.style.width = (Math.min(1, totalProgress) * 100) + '%';
      }
    }

    requestAnimationFrame(animate);
  }

  /* ==========================================================
     SCREEN TRANSITIONS
     ========================================================== */
  function startExercise() {
    // Make sure orbit matches current viewport
    sizeOrbitRing();

    // Pre-set planet at the starting position — back of the orbit
    // (top of the ellipse, smallest / most distant).
    const dims = getOrbitDims();
    setPlanetTransform(0, -dims.ry, dims.minScale);

    instruction.textContent = 'Inhale';
    progressFill.style.width = '0%';
    lastPhase = '';

    startScreen.classList.add('hidden');
    exerciseScreen.classList.remove('hidden');

    // Brief pause so the user can settle before the first breath
    setTimeout(() => {
      exerciseStartTime = performance.now();
      exerciseActive    = true;
    }, 1600);
  }

  function endExercise() {
    if (exerciseEnded) return;
    exerciseEnded  = true;
    exerciseActive = false;

    // Stop demo respiration updates (remove this when using real Garmin feed).
    clearInterval(demoTimer);

    // Ensure progress bar is fully filled at the end.
    progressFill.style.width = '100%';

    // Fade out exercise, fade in end screen.
    exerciseScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
  }

  /* ==========================================================
     EVENT WIRING
     ========================================================== */
  beginBtn.addEventListener('click', startExercise);

  window.addEventListener('resize', () => {
    resizeCanvas();
    initStars();
    sizeOrbitRing();
  });

  /* ==========================================================
     INIT
     ========================================================== */
  resizeCanvas();
  initStars();
  sizeOrbitRing();
  generateAsteroidBelt();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
