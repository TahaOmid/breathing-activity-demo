<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UFO Breath · Cosmic Respiration Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;800&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --hud: #9bff6a;
    --hud-soft: rgba(155, 255, 106, 0.55);
    --hud-dim: rgba(155, 255, 106, 0.25);
    --text: #e8f4ff;
    --text-dim: rgba(232, 244, 255, 0.45);
    --bg: #04081a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #canvas { display: block; width: 100vw; height: 100vh; position: fixed; inset: 0; }

  /* HUD layer */
  .hud {
    position: fixed;
    pointer-events: none;
    color: var(--hud);
    font-family: 'JetBrains Mono', monospace;
    z-index: 10;
  }

  .hud-top {
    top: 0; left: 0; right: 0;
    padding: 28px 36px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  /* Respiration Rate display, positioned above the UFO */
  .rr-display {
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .rr-display .rr-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.4em;
    color: var(--hud-soft);
    text-indent: 0.4em;
  }
  .rr-display .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 0 18px rgba(155, 255, 106, 0.45);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .rr-display .metric-value.pulse { transform: scale(1.05); }

  /* Cycle progress bar (replaces numeric cycle counter), sits under the RR number */
  .progress-wrap {
    pointer-events: none;
    width: 240px;
    margin-top: 10px;
  }
  .progress-track {
    width: 100%;
    height: 10px;
    background: rgba(155, 255, 106, 0.1);
    border: 1px solid rgba(155, 255, 106, 0.4);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 8px rgba(155, 255, 106, 0.08);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(155, 255, 106, 0.85), var(--hud));
    box-shadow: 0 0 16px rgba(155, 255, 106, 0.75),
                0 0 4px rgba(155, 255, 106, 0.9) inset;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .title-block { line-height: 1; }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.42em;
    color: var(--text);
    text-shadow: 0 0 18px rgba(155, 255, 106, 0.35);
  }

  .title-sub {
    font-size: 9px;
    letter-spacing: 0.32em;
    color: var(--hud-soft);
    margin-top: 8px;
  }

  .telemetry {
    display: flex;
    gap: 28px;
    text-align: right;
  }

  .metric { pointer-events: auto; }
  .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 0 16px rgba(155, 255, 106, 0.4);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .metric-value.pulse { transform: scale(1.05); }
  .metric-label {
    font-size: 8.5px;
    letter-spacing: 0.32em;
    color: var(--hud-soft);
    margin-top: 6px;
  }

  /* Center phase HUD */
  .hud-phase {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .hud-phase.ready { opacity: 1; }

  .phase-ring {
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phase-ring svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: rgba(155, 255, 106, 0.08);
    stroke-width: 1;
  }
  .ring-progress {
    fill: none;
    stroke: var(--hud);
    stroke-width: 1.5;
    stroke-linecap: round;
    filter: drop-shadow(0 0 8px var(--hud));
    transition: stroke-dashoffset 0.05s linear;
  }

  .phase-content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .phase-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.6em;
    text-indent: 0.6em;
    color: var(--text);
    text-shadow: 0 0 24px rgba(155, 255, 106, 0.5);
  }

  .phase-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--hud-soft);
    margin-top: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom HUD */
  .hud-bottom {
    bottom: 0; left: 0; right: 0;
    padding: 28px 36px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .controls {
    pointer-events: auto;
    display: flex;
    gap: 8px;
  }

  .btn {
    background: rgba(155, 255, 106, 0.06);
    border: 1px solid rgba(155, 255, 106, 0.28);
    color: var(--hud);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.28em;
    padding: 11px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .btn:hover {
    background: rgba(155, 255, 106, 0.14);
    border-color: var(--hud);
    box-shadow: 0 0 18px rgba(155, 255, 106, 0.18);
  }
  .btn:active { transform: translateY(1px); }

  /* corner brackets */
  .bracket {
    position: fixed;
    width: 22px;
    height: 22px;
    border: 1px solid var(--hud-dim);
    pointer-events: none;
    z-index: 4;
  }
  .bracket.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .bracket.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  /* Intro overlay */
  .intro {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(4, 8, 26, 0.85), rgba(4, 8, 26, 0.98));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.8s ease;
  }
  .intro.hide { opacity: 0; pointer-events: none; }

  .intro-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 18px;
    line-height: 1.6;
    letter-spacing: 0.02em;
    color: var(--text);
    text-align: center;
    max-width: 520px;
    margin: 0 32px 44px;
    text-shadow: 0 0 24px rgba(155, 255, 106, 0.25);
  }

  /* completion overlay */
  .complete {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(4, 8, 26, 0.88), rgba(4, 8, 26, 0.98));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .complete.show {
    opacity: 1;
    pointer-events: auto;
  }
  .complete-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    letter-spacing: 0.4em;
    margin-bottom: 14px;
    color: var(--text);
    text-shadow: 0 0 40px rgba(155, 255, 106, 0.4);
  }
  .complete-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--hud-soft);
    margin-bottom: 32px;
  }

  @media (max-width: 640px) {
    .rr-display { top: 4vh; }
    .rr-display .metric-value { font-size: 22px; }
    .rr-display .rr-label { font-size: 8px; letter-spacing: 0.32em; }
    .progress-wrap { width: 180px; }
    .phase-ring { width: 220px; height: 220px; }
    .phase-text { font-size: 16px; letter-spacing: 0.5em; }
    .intro-text { font-size: 16px; margin: 0 22px 36px; }
    .btn { padding: 9px 14px; font-size: 9px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- corner brackets -->
<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<!-- Respiration Rate display, positioned above the UFO -->
<!--
  GARMIN INTEGRATION POINT (DOM):
  The #bpm element below is what gets updated with live respiration data.
  See the script section for the JS hook where the Garmin watch reading
  should be plugged in.
-->
<div class="hud rr-display">
  <div class="rr-label">RESPIRATION RATE</div>
  <div class="metric-value" id="bpm">6.0</div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<!-- Center phase ring -->
<div class="hud hud-phase" id="hudPhase">
  <div class="phase-ring">
    <svg viewBox="0 0 280 280">
      <circle class="ring-track" cx="140" cy="140" r="135"></circle>
      <circle
        class="ring-progress"
        id="ringProgress"
        cx="140" cy="140" r="135"
        stroke-dasharray="848.23"
        stroke-dashoffset="848.23"
      ></circle>
    </svg>
    <div class="phase-content">
      <div class="phase-text" id="phaseText">READY</div>
    </div>
  </div>
</div>

<!-- Intro overlay -->
<div class="intro" id="intro">
  <div class="intro-text">
    Breathe in and watch the UFO beam your Patapons into the stars. Each calm inhale lifts them higher into the cosmos.
  </div>
  <button class="btn" id="startBtn">BEGIN ASCENSION</button>
</div>

<!-- Completion overlay -->
<div class="complete" id="complete">
  <div class="complete-title">SESSION COMPLETE</div>
  <div class="complete-sub">33 CYCLES · YOU HAVE ASCENDED</div>
  <button class="btn" id="restartBtn">RESTART PROTOCOL</button>
</div>

<script>
(() => {
  // ───── Canvas setup ─────────────────────────────────────────────
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, S = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H) / 720;  // global scale factor
  }
  window.addEventListener('resize', resize);
  resize();

  // ───── Breath timing ─────────────────────────────────────────────
  const INHALE = 4000;
  const HOLD   = 0;       // no hold for natural flow; can be added
  const EXHALE = 6000;
  const CYCLE  = INHALE + HOLD + EXHALE;  // 10s = 6 BPM
  const TOTAL_CYCLES = 33;

  let elapsed = 0;
  let lastT = performance.now();
  let paused = true;     // begin paused until user clicks start
  let complete = false;
  let lastCycleIdx = -1;

  // ───── Easing ────────────────────────────────────────────────────
  const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const easeOut   = t => 1 - Math.pow(1-t, 3);
  const easeIn    = t => t*t*t;

  // ───── Stars ─────────────────────────────────────────────────────
  const stars = [];
  for (let i = 0; i < 220; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.75,
      s: Math.random() * 1.4 + 0.3,
      tw: Math.random() * Math.PI * 2,
      tws: 0.4 + Math.random() * 1.4,
      big: Math.random() < 0.05,
    });
  }

  // ───── Drifting particles (atmosphere) ───────────────────────────
  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.00004,
      vy: -Math.random() * 0.00008 - 0.00002,
      s: Math.random() * 1.4 + 0.3,
      a: 0.15 + Math.random() * 0.35,
      hue: Math.random() < 0.3 ? 'green' : 'blue',
    });
  }

  // ───── Meteors ───────────────────────────────────────────────────
  let meteors = [];
  let nextMeteor = 2500;

  // ───── Patapons (the cute little aliens) ─────────────────────────
  let patapons = [];
  function seedPatapons() {
    patapons = [];
    const n = 9;
    for (let i = 0; i < n; i++) {
      patapons.push({
        bx: 0.14 + (i / (n - 1)) * 0.72 + (Math.random() - 0.5) * 0.035,
        offY: Math.random() * 0.02,
        hopPhase: Math.random() * Math.PI * 2,
        hopSpeed: 0.003 + Math.random() * 0.002,
        type: i % 3,         // 0=round, 1=helmet, 2=spear
        delay: Math.random() * 0.18,
        wobblePhase: Math.random() * Math.PI * 2,
      });
    }
  }
  seedPatapons();

  // ───── Drawing helpers ───────────────────────────────────────────

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    '#03061a');
    g.addColorStop(0.35, '#081335');
    g.addColorStop(0.7,  '#102558');
    g.addColorStop(1,    '#1a3b82');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // subtle nebula glow
    const ng = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.3, Math.max(W,H)*0.6);
    ng.addColorStop(0, 'rgba(60, 90, 180, 0.18)');
    ng.addColorStop(1, 'rgba(60, 90, 180, 0)');
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds(now) {
    ctx.save();
    const drift = Math.sin(now * 0.00008) * 8;

    // left cluster
    drawCloud(W * 0.02 + drift, H * 1.02,  220*S, '#1c2f5e', 0.85);
    drawCloud(W * 0.18 + drift, H * 1.06,  170*S, '#243f78', 0.7);
    drawCloud(W * -0.08 + drift, H * 0.96, 200*S, '#2a4a8a', 0.55);

    // right cluster
    drawCloud(W * 0.88 - drift, H * 0.86, 240*S, '#1c2f5e', 0.85);
    drawCloud(W * 1.05 - drift, H * 0.94, 180*S, '#243f78', 0.7);
    drawCloud(W * 0.72 - drift, H * 1.04, 200*S, '#2a4a8a', 0.6);
    ctx.restore();
  }

  function drawCloud(x, y, r, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - r*0.65, y + r*0.05, r*0.45, 0, Math.PI * 2);
    ctx.arc(x - r*0.2,  y - r*0.18, r*0.55, 0, Math.PI * 2);
    ctx.arc(x + r*0.25, y - r*0.13, r*0.5,  0, Math.PI * 2);
    ctx.arc(x + r*0.68, y + r*0.02, r*0.42, 0, Math.PI * 2);
    ctx.arc(x,          y + r*0.28, r*0.6,  0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStars(now) {
    for (const s of stars) {
      const tw = 0.45 + 0.55 * Math.sin(now * 0.001 * s.tws + s.tw);
      const a = 0.3 + 0.7 * tw;
      const px = s.x * W;
      const py = s.y * H;

      if (s.big) {
        drawSparkleStar(px, py, (5 + tw * 4) * Math.max(0.6, S), a);
      } else {
        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
        ctx.beginPath();
        ctx.arc(px, py, s.s * Math.max(0.5, S), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawSparkleStar(x, y, size, alpha) {
    ctx.save();
    ctx.translate(x, y);

    // soft halo
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.5);
    g.addColorStop(0,   `rgba(255, 255, 255, ${alpha * 0.6})`);
    g.addColorStop(0.3, `rgba(200, 220, 255, ${alpha * 0.2})`);
    g.addColorStop(1,   'rgba(200, 220, 255, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, size * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 4-point sparkle
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.18, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.18, 0);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-size, 0);
    ctx.lineTo(0, size * 0.18);
    ctx.lineTo(size, 0);
    ctx.lineTo(0, -size * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(now, dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      if (p.x < -0.02 || p.x > 1.02) p.x = Math.random();

      const tw = 0.6 + 0.4 * Math.sin(now * 0.002 + p.x * 20);
      const a = p.a * tw;
      const c = p.hue === 'green'
        ? `rgba(180, 255, 160, ${a})`
        : `rgba(180, 220, 255, ${a})`;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.s * Math.max(0.6, S), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateMeteors(now, dt) {
    nextMeteor -= dt;
    if (nextMeteor <= 0) {
      nextMeteor = 4000 + Math.random() * 7000;
      const fromLeft = Math.random() < 0.5;
      meteors.push({
        x: fromLeft ? -50 : W + 50,
        y: Math.random() * H * 0.4,
        vx: (fromLeft ? 1 : -1) * (380 + Math.random() * 180),
        vy: 220 + Math.random() * 140,
        life: 0,
        max: 1600 + Math.random() * 600,
      });
    }

    meteors = meteors.filter(m => {
      m.life += dt;
      m.x += m.vx * dt / 1000;
      m.y += m.vy * dt / 1000;

      const p = m.life / m.max;
      const a = Math.sin(p * Math.PI) * 0.9;
      const trailLen = 0.18;

      const tx = m.x - m.vx * trailLen / 1000 * 1000 * 0.18;
      const ty = m.y - m.vy * trailLen / 1000 * 1000 * 0.18;

      const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
      grad.addColorStop(0,   `rgba(255, 240, 200, ${a})`);
      grad.addColorStop(0.4, `rgba(255, 200, 140, ${a * 0.4})`);
      grad.addColorStop(1,   'rgba(255, 200, 140, 0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.2 * Math.max(0.6, S);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      // bright head
      const hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 8*S);
      hg.addColorStop(0, `rgba(255, 255, 230, ${a})`);
      hg.addColorStop(1, 'rgba(255, 255, 230, 0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 8*S, 0, Math.PI * 2);
      ctx.fill();

      return m.life < m.max && m.x > -100 && m.x < W + 100 && m.y < H + 100;
    });
  }

  function drawUFO(cx, cy, scale, now) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(Math.sin(now * 0.0009) * 0.025);

    // soft shadow under saucer
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 22, 78, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Saucer body ─────────────────────────
    const bodyGrad = ctx.createLinearGradient(0, -8, 0, 26);
    bodyGrad.addColorStop(0,    '#eef3f9');
    bodyGrad.addColorStop(0.45, '#a8b8cc');
    bodyGrad.addColorStop(1,    '#52647e');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 8, 84, 19, 0, 0, Math.PI * 2);
    ctx.fill();

    // mid stripe (where lights sit) — slight inner curve
    const stripeGrad = ctx.createLinearGradient(0, -2, 0, 14);
    stripeGrad.addColorStop(0, '#7d8ba1');
    stripeGrad.addColorStop(1, '#3b4a64');
    ctx.fillStyle = stripeGrad;
    ctx.beginPath();
    ctx.ellipse(0, 7, 74, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Yellow rim lights ──────────────────
    const numLights = 7;
    for (let i = 0; i < numLights; i++) {
      const t = (i / (numLights - 1)) * 2 - 1;        // -1..1
      const x = t * 60;
      const y = 7 + (1 - Math.cos(t * Math.PI * 0.5)) * 1.2;
      const blink = 0.7 + 0.3 * Math.sin(now * 0.005 + i * 1.3);

      // halo
      const lg = ctx.createRadialGradient(x, y, 0, x, y, 10);
      lg.addColorStop(0, `rgba(255, 230, 100, ${0.65 * blink})`);
      lg.addColorStop(1, 'rgba(255, 230, 100, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();

      // bulb
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(x, y, 3.2, 0, Math.PI * 2);
      ctx.fill();

      // specular
      ctx.fillStyle = '#fff8d0';
      ctx.beginPath();
      ctx.arc(x - 0.9, y - 0.9, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // top of saucer between dome and body
    const topGrad = ctx.createLinearGradient(0, -6, 0, 4);
    topGrad.addColorStop(0, '#c5d2e0');
    topGrad.addColorStop(1, '#7a8aa3');
    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.ellipse(0, -2, 36, 6, 0, Math.PI, 0);
    ctx.closePath();
    ctx.fill();

    // ── Dome (cyan glass) ──────────────────
    const domeGrad = ctx.createRadialGradient(-9, -18, 1, 0, -8, 32);
    domeGrad.addColorStop(0,    '#e8faff');
    domeGrad.addColorStop(0.35, '#7fd3ed');
    domeGrad.addColorStop(0.85, '#2e93c0');
    domeGrad.addColorStop(1,    '#1b6488');
    ctx.fillStyle = domeGrad;
    ctx.beginPath();
    ctx.ellipse(0, -4, 30, 24, 0, Math.PI, 0);
    ctx.closePath();
    ctx.fill();

    // dome rim shine
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(0, -4, 30, 24, 0, Math.PI, 0);
    ctx.stroke();

    // dome highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    ctx.ellipse(-11, -17, 7.5, 3.5, -0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    ctx.ellipse(-4, -22, 3, 1.4, -0.32, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBeam(cx, topY, length, intensity, breathPhase, now) {
    if (length < 2) return;

    ctx.save();

    const baseHalf = (24 + intensity * 14) * S;
    const bottomHalf = baseHalf * 1.22;
    const bottomY = topY + length;

    // outer atmospheric glow
    const og = ctx.createRadialGradient(cx, topY + length * 0.55, 0, cx, topY + length * 0.55, baseHalf * 4);
    og.addColorStop(0,   'rgba(150, 255, 100, 0.18)');
    og.addColorStop(0.5, 'rgba(150, 255, 100, 0.06)');
    og.addColorStop(1,   'rgba(150, 255, 100, 0)');
    ctx.fillStyle = og;
    ctx.fillRect(cx - baseHalf * 4, topY - 20, baseHalf * 8, length + 60);

    // beam main body (trapezoid)
    const beamGrad = ctx.createLinearGradient(cx - bottomHalf, 0, cx + bottomHalf, 0);
    beamGrad.addColorStop(0,    'rgba(100, 220, 70, 0)');
    beamGrad.addColorStop(0.2,  'rgba(130, 240, 90, 0.35)');
    beamGrad.addColorStop(0.5,  'rgba(210, 255, 150, 0.85)');
    beamGrad.addColorStop(0.8,  'rgba(130, 240, 90, 0.35)');
    beamGrad.addColorStop(1,    'rgba(100, 220, 70, 0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(cx - baseHalf, topY);
    ctx.lineTo(cx + baseHalf, topY);
    ctx.lineTo(cx + bottomHalf, bottomY);
    ctx.lineTo(cx - bottomHalf, bottomY);
    ctx.closePath();
    ctx.fill();

    // additive bright core
    ctx.globalCompositeOperation = 'lighter';
    const coreW = 6 * S;
    const coreGrad = ctx.createLinearGradient(cx - coreW, 0, cx + coreW, 0);
    coreGrad.addColorStop(0,   'rgba(220, 255, 160, 0)');
    coreGrad.addColorStop(0.5, 'rgba(255, 255, 230, 0.85)');
    coreGrad.addColorStop(1,   'rgba(220, 255, 160, 0)');
    ctx.fillStyle = coreGrad;
    ctx.fillRect(cx - coreW, topY, coreW * 2, length);

    // sparkle particles inside beam
    const numSparkles = Math.floor(length / (6 / Math.max(0.6, S)));
    for (let i = 0; i < numSparkles; i++) {
      // particle scrolls along beam; during INHALE it moves UP, during EXHALE it moves DOWN
      const dir = breathPhase === 'INHALE' ? -1 : 1;
      const speed = 0.00025 + (i % 4) * 0.00012;
      const ty = ((now * speed * dir + i * 0.137) % 1 + 1) % 1;

      const lateral = Math.sin(now * 0.001 + i * 0.7) * 0.65;
      const widthAtY = baseHalf + (bottomHalf - baseHalf) * ty;
      const py = topY + ty * length;
      const px = cx + lateral * widthAtY;
      const ps = (0.8 + Math.sin(now * 0.004 + i) * 0.5) * Math.max(0.6, S);
      const pa = 0.55 + 0.45 * Math.sin(now * 0.0025 + i * 0.9);

      ctx.fillStyle = `rgba(255, 255, 210, ${pa})`;
      ctx.beginPath();
      ctx.arc(px, py, ps, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';

    // ground pool ellipse at beam base
    const gg = ctx.createRadialGradient(cx, bottomY, 0, cx, bottomY, bottomHalf * 1.8);
    gg.addColorStop(0,    'rgba(220, 255, 150, 0.55)');
    gg.addColorStop(0.4,  'rgba(150, 255, 100, 0.28)');
    gg.addColorStop(1,    'rgba(150, 255, 100, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(cx, bottomY, bottomHalf * 1.8, bottomHalf * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawPatapons(now, phase, phaseProgress, beamPhase, ufoCx, ufoCy, ufoScale) {
    const groundY = H * 0.93;
    const beamHalf = (24 + beamPhase * 14) * S * 1.22;

    for (let i = 0; i < patapons.length; i++) {
      const p = patapons[i];
      const baseX = p.bx * W;
      const inBeam = Math.abs(baseX - ufoCx) < beamHalf * 2.4 + 30 * S;

      let px = baseX;
      let py = groundY + p.offY * H + Math.sin(now * p.hopSpeed + p.hopPhase) * 2.5 * S;
      let scale = S;
      let alpha = 1;

      if (phase === 'INHALE' && inBeam) {
        // local progress with stagger
        const lp = Math.max(0, Math.min(1, (phaseProgress - p.delay) / (1 - p.delay)));
        const eased = easeIn(lp);

        const targetY = ufoCy + 4 * ufoScale;
        py = py * (1 - eased) + targetY * eased;
        px = baseX * (1 - eased * 0.6) + ufoCx * (eased * 0.6);

        // wobble while rising
        px += Math.sin(now * 0.008 + p.wobblePhase) * eased * 6 * S;

        scale = S * (1 - eased * 0.85);
        alpha = 1 - eased * 0.92;
      } else if (phase === 'EXHALE') {
        // fade in over the first ~25% of exhale
        if (phaseProgress < 0.25 && inBeam) {
          alpha = phaseProgress / 0.25;
        }
      } else if (phase === 'HOLD') {
        alpha = inBeam ? 0 : 1;
      }

      drawPatapon(px, py, scale, alpha, p.type, now + i * 73);
    }
  }

  function drawPatapon(x, y, scale, alpha, type, t) {
    if (scale < 0.02 || alpha < 0.04) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    // tiny shadow on ground (only if reasonably sized)
    if (scale > 0.4 * S) {
      ctx.fillStyle = `rgba(0, 0, 0, ${0.25 * alpha})`;
      ctx.beginPath();
      ctx.ellipse(0, 18, 11, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // body
    ctx.fillStyle = '#080808';

    if (type === 0) {
      // round
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 1) {
      // helmet/cone
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.quadraticCurveTo(-13, -13, 0, -15);
      ctx.quadraticCurveTo(13, -13, 12, 0);
      ctx.quadraticCurveTo(12, 13, 0, 15);
      ctx.quadraticCurveTo(-12, 13, -12, 0);
      ctx.closePath();
      ctx.fill();
      // top helmet spike
      ctx.beginPath();
      ctx.moveTo(-2.5, -14);
      ctx.lineTo(0, -22);
      ctx.lineTo(2.5, -14);
      ctx.closePath();
      ctx.fill();
    } else {
      // bird-like oval
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      // little tail tuft
      ctx.beginPath();
      ctx.moveTo(-11, -2);
      ctx.lineTo(-16, -8);
      ctx.lineTo(-11, -6);
      ctx.closePath();
      ctx.fill();
    }

    // big eye white
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(2.2, -2, 5.2, 0, Math.PI * 2);
    ctx.fill();

    // pupil
    ctx.fillStyle = '#080808';
    ctx.beginPath();
    ctx.arc(3.2, -1.5, 2.3, 0, Math.PI * 2);
    ctx.fill();

    // catchlight
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(4.1, -2.4, 0.85, 0, Math.PI * 2);
    ctx.fill();

    // feet
    if (type !== 1) {
      ctx.fillStyle = '#080808';
      ctx.beginPath();
      ctx.ellipse(-5, 13.5, 3, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(5, 13.5, 3, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // spear for type 2
    if (type === 2) {
      ctx.strokeStyle = '#7a5230';
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(11, -8);
      ctx.lineTo(19, -28);
      ctx.stroke();
      ctx.fillStyle = '#d6d0c4';
      ctx.beginPath();
      ctx.moveTo(19, -28);
      ctx.lineTo(22, -33);
      ctx.lineTo(17, -32);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  // ───── Main loop ─────────────────────────────────────────────────
  const phaseTextEl = document.getElementById('phaseText');
  const ringProgressEl = document.getElementById('ringProgress');
  const progressFillEl = document.getElementById('progressFill');
  const bpmEl = document.getElementById('bpm');
  const hudPhase = document.getElementById('hudPhase');
  const RING_LEN = 2 * Math.PI * 135;
  ringProgressEl.setAttribute('stroke-dasharray', RING_LEN);

  function frame(now) {
    const dt = Math.min(50, now - lastT);
    lastT = now;
    if (!paused && !complete) elapsed += dt;

    // determine cycle & phase
    const cycleIdx = Math.floor(elapsed / CYCLE);
    if (cycleIdx >= TOTAL_CYCLES) {
      complete = true;
      document.getElementById('complete').classList.add('show');
    }

    const inCycle = elapsed % CYCLE;
    let phase, phaseProgress, beamPhase, phaseDur, phaseRemaining;

    if (inCycle < INHALE) {
      phase = 'INHALE';
      phaseDur = INHALE;
      phaseProgress = inCycle / INHALE;
      // beam shortens from 1 → 0.12
      beamPhase = 1 - easeInOut(phaseProgress) * 0.88;
    } else if (inCycle < INHALE + HOLD) {
      phase = 'HOLD';
      phaseDur = HOLD;
      phaseProgress = (inCycle - INHALE) / Math.max(1, HOLD);
      beamPhase = 0.12;
    } else {
      phase = 'EXHALE';
      phaseDur = EXHALE;
      phaseProgress = (inCycle - INHALE - HOLD) / EXHALE;
      // beam extends from 0.12 → 1
      beamPhase = 0.12 + easeInOut(phaseProgress) * 0.88;
    }
    phaseRemaining = (phaseDur * (1 - phaseProgress)) / 1000;

    // ── Draw scene ───────────────────────────
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawStars(now);
    drawParticles(now, dt);
    updateMeteors(now, dt);
    drawClouds(now);

    // UFO position
    const ufoCx = W * 0.5;
    const ufoBaseY = H * 0.18 + 30 * S;
    const ufoCy = ufoBaseY + Math.sin(now * 0.0014) * 6 * S;
    const ufoScale = S * 1.2;
    const beamTop = ufoCy + 24 * ufoScale;
    const beamMaxLen = H * 0.93 - beamTop;
    const beamLen = beamMaxLen * beamPhase;

    drawBeam(ufoCx, beamTop, beamLen, beamPhase, phase, now);
    drawPatapons(now, phase, phaseProgress, beamPhase, ufoCx, ufoCy + 6 * ufoScale, ufoScale);
    drawUFO(ufoCx, ufoCy, ufoScale, now);

    // ── Update HUD ───────────────────────────
    if (!complete && !paused && cycleIdx !== lastCycleIdx) {
      lastCycleIdx = cycleIdx;
      // pulse the BPM display each cycle
      bpmEl.classList.add('pulse');
      setTimeout(() => bpmEl.classList.remove('pulse'), 350);
    }

    if (phaseTextEl.textContent !== phase) phaseTextEl.textContent = phase;

    // Ring shows phase progress
    const ringOffset = RING_LEN * (1 - phaseProgress);
    ringProgressEl.setAttribute('stroke-dashoffset', ringOffset.toFixed(2));

    // Cycle progress bar — fills smoothly from 0% to 100% across all cycles.
    // Uses fractional progress (elapsed / total duration) so the bar grows
    // continuously rather than stepping per cycle.
    const totalDuration = CYCLE * TOTAL_CYCLES;
    const overallProgress = Math.min(1, elapsed / totalDuration);
    progressFillEl.style.width = (overallProgress * 100).toFixed(2) + '%';

    // ─────────────────────────────────────────────────────────────
    // GARMIN INTEGRATION POINT (JS):
    // Replace the simulated value below with the live respiration rate
    // pulled from the Garmin watch (breaths per minute).
    //
    // Example, once a Garmin data source is wired up:
    //   const liveRR = garmin.getRespirationRate();   // breaths/min
    //   if (Number.isFinite(liveRR)) {
    //     bpmEl.textContent = liveRR.toFixed(1);
    //   }
    //
    // For now we display the protocol's target rate (60s / cycle length)
    // with a tiny wobble so the readout feels alive.
    // ─────────────────────────────────────────────────────────────
    const baseBPM = 60000 / CYCLE;
    const wobble = Math.sin(now * 0.0009) * 0.05;
    bpmEl.textContent = (baseBPM + wobble).toFixed(1);

    requestAnimationFrame(frame);
  }

  // ───── UI handlers ───────────────────────────────────────────────
  function reset() {
    elapsed = 0;
    paused = false;
    complete = false;
    lastCycleIdx = -1;
    document.getElementById('complete').classList.remove('show');
    seedPatapons();
  }

  document.getElementById('restartBtn').onclick = () => {
    reset();
  };

  document.getElementById('startBtn').onclick = () => {
    document.getElementById('intro').classList.add('hide');
    hudPhase.classList.add('ready');
    paused = false;
    lastT = performance.now();
  };

  // keyboard: spacebar to start from intro; R to reset
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!document.getElementById('intro').classList.contains('hide')) {
        document.getElementById('startBtn').click();
      }
    } else if (e.code === 'KeyR') {
      reset();
    }
  });

  requestAnimationFrame((t) => { lastT = t; frame(t); });
})();
</script>
</body>
</html>
