<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1f" />
  <title>Congratulations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Palette shared with the selection screen so the two read as one app. */
    :root {
      --bg-deep:  #0a0a1f;
      --bg-mid:   #1a1438;
      --bg-soft:  #2d1f5a;
      --accent:   #f5d0a9;
      --text:     #f4eef9;
      --text-dim: #b8a8d4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);

      /* Glass surface tokens — used by the badge and the submit button. */
      --glass-bg:     rgba(255, 255, 255, 0.06);
      --glass-bg-hi:  rgba(255, 255, 255, 0.10);
      --glass-stroke: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: calc(20px + var(--safe-top)) 22px calc(40px + var(--safe-bot));
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-soft) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #3a1e5c 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 100%, #1b1745 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      background-attachment: fixed;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Same twinkling starfield as the selection screen. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 18% 22%, rgba(255,255,255,.65) 50%, transparent 51%),
        radial-gradient(1px 1px at 82% 18%, rgba(255,255,255,.45) 50%, transparent 51%),
        radial-gradient(1px 1px at 62% 70%, rgba(255,255,255,.5)  50%, transparent 51%),
        radial-gradient(1px 1px at 28% 82%, rgba(255,255,255,.35) 50%, transparent 51%),
        radial-gradient(1px 1px at 90% 52%, rgba(255,255,255,.5)  50%, transparent 51%),
        radial-gradient(1px 1px at 8%  60%, rgba(255,255,255,.4)  50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 48% 14%, rgba(245,208,169,.55) 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 88%, rgba(255,255,255,.4)  50%, transparent 51%);
      background-size: 720px 720px;
      opacity: .7;
      pointer-events: none;
      animation: twinkle 9s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .55; }
      50%      { opacity: .9;  }
    }

    /* Card column: centred vertically, button pinned near the bottom. */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      padding: 12vh 0 4vh;
    }

    /* ---------- Badge ---------- */

    .badge {
      position: relative;
      width: 152px;
      height: 152px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      animation:
        float 5.4s ease-in-out infinite,
        fadeUp .9s ease-out .05s both;
    }

    .badge-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--glass-bg-hi);
      border: 1px solid var(--glass-stroke);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        0 24px 48px -16px rgba(0,0,0,.55),
        0 0 60px -10px rgba(245,208,169,.18);
      display: grid;
      place-items: center;
    }

    /* Soft accent halo behind the disc — keeps the cosmic warmth. */
    .badge::before {
      content: "";
      position: absolute;
      inset: -22%;
      background: radial-gradient(circle, rgba(245,208,169,.18) 0%, transparent 62%);
      z-index: -1;
      pointer-events: none;
    }

    .check {
      width: 58%;
      height: 58%;
      stroke: var(--text);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: drawCheck .7s cubic-bezier(.6,.1,.3,1) .5s forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Sparkles scattered around the badge. */
    .sparkle {
      position: absolute;
      color: var(--accent);
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(245,208,169,.55));
      animation: sparkle 3.2s ease-in-out infinite;
      opacity: 0;
    }
    .sparkle svg { display: block; }
    .sparkle.s1 { top:  4%; left:  10%; width: 14px; animation-delay: .2s;  }
    .sparkle.s2 { top: 12%; right:  -4%; width: 11px; animation-delay: 1.1s; }
    .sparkle.s3 { bottom: 8%; left: -6%;  width: 12px; animation-delay: 1.7s; }
    .sparkle.s4 { bottom: 0%; right:  14%; width: 9px;  animation-delay: 2.3s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0;   transform: scale(.6) rotate(0deg);   }
      40%      { opacity: 1;   transform: scale(1)  rotate(180deg); }
      60%      { opacity: .85; transform: scale(1)  rotate(220deg); }
    }

    /* ---------- Copy ---------- */

    .title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: clamp(32px, 8.5vw, 44px);
      line-height: 1.2;
      letter-spacing: -.02em;
      background: linear-gradient(180deg, #fff 0%, #d4c5e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      animation: fadeUp .8s ease-out .35s both;
    }
    .title em {
      font-style: italic;
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
    }

    .subtitle {
      font-size: 15px;
      font-weight: 300;
      color: var(--text-dim);
      text-align: center;
      max-width: 28ch;
      animation: fadeUp .8s ease-out .5s both;
    }

    /* ---------- Submit button ---------- */

    .submit-wrap {
      width: 100%;
      max-width: 360px;
      margin-top: auto;
      padding-top: 32px;
      animation: fadeUp .8s ease-out .7s both;
    }

    .submit-btn {
      width: 100%;
      padding: 18px 24px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: .01em;
      color: var(--text);
      background: var(--glass-bg);
      border: 1px solid var(--glass-stroke);
      border-radius: 16px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 16px 32px -16px rgba(0,0,0,.6);
      cursor: pointer;
      transition:
        transform .18s cubic-bezier(.34, 1.56, .64, 1),
        background .2s ease,
        border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .submit-btn:hover {
      background: var(--glass-bg-hi);
      border-color: rgba(255,255,255,.28);
    }
    .submit-btn:active { transform: scale(.97); }
    .submit-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ---------- Animations ---------- */

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .badge, .check, .sparkle, .title, .subtitle, .submit-wrap, body::before {
        animation: none !important;
      }
      .check { stroke-dashoffset: 0; }
      .title, .subtitle, .submit-wrap, .badge { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage" role="main">
    <div class="badge" aria-hidden="true">
      <!-- Decorative sparkles -->
      <span class="sparkle s1"><svg viewBox="0 0 24 24"><path d="M12 0 L13.5 10.5 L24 12 L13.5 13.5 L12 24 L10.5 13.5 L0 12 L10.5 10.5 Z" fill="currentColor"/></svg></span>
      <span class="sparkle s2"><svg viewBox="0 0 24 24"><path d="M12 0 L13.5 10.5 L24 12 L13.5 13.5 L12 24 L10.5 13.5 L0 12 L10.5 10.5 Z" fill="currentColor"/></svg></span>
      <span class="sparkle s3"><svg viewBox="0 0 24 24"><path d="M12 0 L13.5 10.5 L24 12 L13.5 13.5 L12 24 L10.5 13.5 L0 12 L10.5 10.5 Z" fill="currentColor"/></svg></span>
      <span class="sparkle s4"><svg viewBox="0 0 24 24"><path d="M12 0 L13.5 10.5 L24 12 L13.5 13.5 L12 24 L10.5 13.5 L0 12 L10.5 10.5 Z" fill="currentColor"/></svg></span>

      <div class="badge-disc">
        <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12.5 L10 17.5 L19 7" />
        </svg>
      </div>
    </div>

    <h1 class="title"><em>Congratulations</em></h1>
    <p class="subtitle">The breathing exercise is done.</p>

    <div class="submit-wrap">
      <button class="submit-btn" id="submit-btn" type="button">Submit</button>
    </div>
  </main>

  <script>
    /* ============================================================
       SUBMIT BUTTON BEHAVIOUR
       ------------------------------------------------------------
       Wire the Submit button by setting SUBMIT_TARGET to one of:

         1. A URL string — the page navigates there on press.
              SUBMIT_TARGET = "https://example.com/next.html";

         2. A function — called on press. Use this to launch a modal,
            post to an API, send a message to a parent window, etc.
              SUBMIT_TARGET = () => {
                window.parent.postMessage({ type: "breathing-done" }, "*");
              };

         3. null (default) — does nothing but logs to the console.
            Useful while you're still wiring things up.

       The button is also keyboard-accessible (Enter / Space) and
       respects focus-visible styling out of the box.
       ============================================================ */

    const SUBMIT_TARGET = null;

    // Examples — uncomment one to try it:
    // const SUBMIT_TARGET = "https://tahaomid.github.io/breathing-activity-demo/";
    // const SUBMIT_TARGET = () => alert("Thanks! Submission received.");
    // const SUBMIT_TARGET = () => window.parent.postMessage({ type: "breathing-done" }, "*");

    document.getElementById("submit-btn").addEventListener("click", () => {
      if (typeof SUBMIT_TARGET === "string" && SUBMIT_TARGET.length > 0) {
        window.location.href = SUBMIT_TARGET;
      } else if (typeof SUBMIT_TARGET === "function") {
        try {
          SUBMIT_TARGET();
        } catch (err) {
          console.error("SUBMIT_TARGET threw:", err);
        }
      } else {
        console.log(
          "Submit pressed. Set SUBMIT_TARGET (top of script) to a URL " +
          "or a function to wire up this button."
        );
      }
    });
  </script>
</body>
</html>
